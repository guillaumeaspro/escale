<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Escale — ton carnet de voyage</title>
<meta name="description" content="Prépare ton voyage, vis-le avec « What now ? », partage ton carnet de route en direct.">
<meta property="og:title" content="Escale — carnet de voyage"><meta property="og:description" content="Programme, billets, adresses, carnet de route et carte à suivre en direct.">
<meta name="theme-color" content="#141417"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><link rel="icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Escale">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: compagnon de voyage, net et chaleureux, pensé pour le téléphone sur place.
   IDEA: la carte d'embarquement — chaque voyage est un billet, chaque jour une escale.
   PICTURE: le billet du voyage avec la route des villes ; sur place, un radar « What now ? » autour de toi.
   COLOUR and TYPE: blanc, encre, rouge tomate (accent), bleu ciel profond (support) ; Archivo 800/500.
   LAYOUT: colonne d'appli 760px, onglets collants, cartes empilées, rien ne déborde à 360px. */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#111113);--panel:light-dark(#f2f1ee,#1c1c20);--panel2:light-dark(#e8e6e1,#26262b);
--ink:light-dark(#141417,#f2f1ee);--mute:light-dark(#5d5d66,#a3a3ad);--line:light-dark(#dcdad4,#33333a);
--red:light-dark(#e2401f,#ff6447);--blue:light-dark(#1d55cf,#7aa2ff);--pass:light-dark(#141417,#f2f1ee);--passInk:light-dark(#ffffff,#141417);--sea:light-dark(#d9e4f5,#142033);--land:light-dark(#fbfaf8,#2a2a31);--land2:light-dark(#f8d2c7,#5a2c24)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Archivo,system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 96px}
.top{display:flex;align-items:center;gap:12px;padding:14px 16px;max-width:760px;margin:0 auto}
.logo{font-weight:800;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;cursor:pointer;background:none;border:0;padding:0}
.logo i{width:22px;height:22px;border-radius:50%;background:var(--red);display:inline-block;box-shadow:inset -6px -6px 0 rgba(0,0,0,.18)}
.top .sp{flex:1}
.sync{font-size:13px;color:var(--mute)}
h1{font-size:clamp(30px,7vw,46px);line-height:1.04;letter-spacing:-.025em;margin:0;font-weight:800;text-wrap:balance}
h2{font-size:22px;line-height:1.15;margin:28px 0 12px;font-weight:800;letter-spacing:-.01em}
h3{font-size:17px;margin:0;font-weight:700}
small,.mute{color:var(--mute)}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1.5px solid var(--ink);background:transparent;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.p{background:var(--ink);color:var(--bg)}
.btn.r{background:var(--red);border-color:var(--red);color:#fff}
.btn.s{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px;border-width:1px}
.btn.g{border-color:var(--line)}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.card:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{min-height:40px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:15px;font-weight:600;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.scroll{overflow-x:auto;display:flex;gap:8px;padding-bottom:6px;scrollbar-width:thin}
.scroll>*{flex:none}
input,select,textarea{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:9px 12px;font-size:16px}
textarea{min-height:80px;resize:vertical}
label.f{display:block;font-size:14px;font-weight:600;margin:12px 0 4px}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 12px}
.empty{border:1.5px dashed var(--line);border-radius:16px;padding:22px;text-align:center;color:var(--mute)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none;background:currentColor}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--panel2);white-space:nowrap}
.tag.res{background:var(--blue);color:#fff}.tag.must{background:var(--red);color:#fff}
/* billet */
.pass{background:var(--pass);color:var(--passInk);border-radius:22px;padding:22px 22px 18px;position:relative;overflow:hidden;margin-top:6px}
.pass:before,.pass:after{content:"";position:absolute;width:26px;height:26px;border-radius:50%;background:var(--bg);top:calc(100% - 64px)}
.pass:before{left:-13px}.pass:after{right:-13px}
.pass .ph{font-size:14px;font-weight:700;color:var(--red);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pass h1{margin:6px 0 4px}
.route{display:flex;align-items:flex-start;margin:18px 0 22px;position:relative}
.route:before{content:"";position:absolute;left:6px;right:6px;top:6px;border-top:2px dashed currentColor;opacity:.45}
.stop{flex:1;position:relative;font-size:13px;font-weight:700;padding-top:20px;text-align:center;overflow-wrap:anywhere}
.stop:first-child{text-align:left}.stop:last-child{text-align:right}
.stop:before{content:"";position:absolute;top:0;left:50%;margin-left:-7px;width:14px;height:14px;border-radius:50%;background:var(--passInk);border:3px solid var(--pass);box-shadow:0 0 0 2px var(--passInk)}
.stop:first-child:before{left:0;margin:0}.stop:last-child:before{left:auto;right:0;margin:0}
.stop.on:before{background:var(--red);box-shadow:0 0 0 2px var(--red)}
.meta{border-top:2px dashed currentColor;border-color:color-mix(in srgb,var(--passInk) 35%,transparent);padding-top:14px;display:flex;gap:18px;flex-wrap:wrap;font-size:14px}
.meta b{display:block;font-size:20px}
.pass .edit{position:absolute;right:14px;top:14px;color:var(--passInk);border-color:color-mix(in srgb,var(--passInk) 40%,transparent)}
/* onglets */
.tabs{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 10px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.tab{min-height:48px;border-radius:12px;border:0;background:var(--panel);font-weight:800;cursor:pointer;font-size:15px;line-height:1.1;padding:4px}
.tab small{display:block;font-weight:500;font-size:12px}
.tab[aria-selected=true]{background:var(--red);color:#fff}.tab[aria-selected=true] small{color:#fff}
.subs{display:flex;gap:6px;margin:4px 0 6px;flex-wrap:wrap}
/* cartes */
.card{background:var(--panel);border-radius:16px;padding:14px 16px;margin:10px 0}
.trip{display:flex;gap:14px;align-items:center;cursor:pointer;border:0;width:100%;text-align:left;font:inherit}
.trip .big{font-size:20px;font-weight:800;line-height:1.15}
.trip .cd{margin-left:auto;text-align:right;font-weight:800;color:var(--red);white-space:nowrap}
.day header{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.day header b{font-size:18px}
.day header .btn{margin-left:auto}
.items{list-style:none;margin:0;padding:0}
.it{display:grid;grid-template-columns:52px 14px minmax(0,1fr) auto;gap:10px;align-items:start;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.it:first-child{border-top:0}
.it time{font-weight:800;font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
.it .dot{margin-top:7px}
.it b{display:block;line-height:1.25}
.it small{display:block;font-size:13px}
.it.done b{text-decoration:line-through;text-decoration-thickness:2px;opacity:.6}
.it.night{cursor:default;color:var(--mute)}
.pl{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:10px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.pl .dot{margin-top:7px}
.note{font-size:14px;color:var(--mute);margin-top:2px}
.filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:8px 0}
/* what now */
.now{background:var(--pass);color:var(--passInk);border-radius:22px;padding:18px;margin-top:22px}
.now h2{margin:0 0 4px;font-size:26px}
.now .chip{background:transparent;color:var(--passInk);border-color:color-mix(in srgb,var(--passInk) 35%,transparent)}
.now .chip[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff}
.now select,.now input{background:color-mix(in srgb,var(--passInk) 8%,var(--pass));color:var(--passInk);border-color:color-mix(in srgb,var(--passInk) 25%,transparent)}
.now label.f{color:color-mix(in srgb,var(--passInk) 75%,transparent)}
.fig{position:relative;height:300px;margin:14px 0 4px}
.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.res{background:var(--bg);color:var(--ink);border-radius:14px;padding:12px 14px;margin:8px 0;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px}
.res .n{width:28px;height:28px;border-radius:50%;color:#fff;font-weight:800;display:grid;place-items:center;font-size:14px}
.res .act{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.trav{font-weight:700;white-space:nowrap}
/* souvenirs */
.stars{color:var(--red);letter-spacing:1px;white-space:nowrap}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.photos img{width:84px;height:84px;object-fit:cover;border-radius:10px;background:var(--panel2)}
.rate{display:flex;gap:4px;flex-direction:row-reverse;justify-content:flex-end}
.rate input{position:absolute;opacity:0;width:1px;height:1px}
.rate label{font-size:32px;cursor:pointer;color:var(--line);line-height:1;padding:2px}
.rate input:checked~label,.rate label:hover,.rate label:hover~label{color:var(--red)}
.rate input:focus-visible+label{outline:3px solid var(--blue)}
.recap .day{border-left:3px solid var(--red);padding-left:14px;margin:14px 0}
.big3{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:14px 0}
.big3 div{background:var(--panel);border-radius:14px;padding:12px}
.big3 b{display:block;font-size:clamp(22px,6vw,30px);line-height:1}
.big3 span{font-size:13px;color:var(--mute)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(10,10,12,.55);z-index:20;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.md{background:var(--bg);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px 22px}
@media(min-width:700px){.ov{align-items:center}.md{border-radius:22px}}
.md header{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.md header h2{margin:0;flex:1}
.md .foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;position:sticky;bottom:-22px;background:var(--bg);padding:10px 0}
.x{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:22px;line-height:1}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
.toast.on{opacity:1}
.ticket{border:2px dashed var(--line);border-radius:16px;padding:16px;text-align:center}
.ticket .ref{font-size:clamp(26px,8vw,40px);font-weight:800;letter-spacing:.06em;overflow-wrap:anywhere}
.files a{display:block;margin:8px 0;font-weight:600}
.files img{max-width:100%;border-radius:12px;margin-top:8px}
.hint{font-size:13px;color:var(--mute);margin-top:6px}
.load{color:var(--mute);font-size:14px}
.mapf{position:relative;height:clamp(260px,52vw,420px);border-radius:20px;overflow:hidden;margin:12px 0;background:var(--sea)}
.mapf>svg,.mapf .lf{position:absolute;inset:0;width:100%;height:100%}.mapf .cap{z-index:500}
.pin{width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;border:3px solid #fff;font:800 12px/20px Archivo,sans-serif;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.pin.ph{width:42px;height:42px;background-size:cover;background-position:center}
.leaflet-container{font:inherit;background:var(--sea)}
.mapf .cap{position:absolute;left:12px;bottom:10px;background:var(--bg);color:var(--ink);border-radius:10px;padding:4px 10px;font-size:13px;font-weight:700}
.step{background:var(--panel);border-radius:18px;overflow:hidden;margin:12px 0}
.sph{display:grid;gap:3px;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;height:clamp(200px,48vw,320px);position:relative}
.sph img{width:100%;height:100%;object-fit:cover;background:var(--panel2);display:block}
.sph.n1{grid-template-columns:1fr;grid-template-rows:1fr}.sph.n2{grid-template-columns:1fr 1fr;grid-template-rows:1fr}.sph.n3 img:first-child{grid-row:1/3}
.sph .more{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.6);color:#fff;border-radius:8px;padding:2px 8px;font-weight:700}
.sb{padding:12px 16px 14px}.sn{font-size:18px}.stx{margin:8px 0 0;white-space:pre-wrap}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:#fff;background:var(--red);border-radius:99px;padding:3px 10px;white-space:nowrap}
.live:before{content:"";width:7px;height:7px;border-radius:50%;background:#fff}
@media(max-width:600px){.g2{grid-template-columns:minmax(0,1fr)}.filters{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.filters .q{grid-column:1/-1}.big3{grid-template-columns:repeat(2,minmax(0,1fr))}.it{grid-template-columns:46px 12px minmax(0,1fr)}.it .side{grid-column:3}}
@media(prefers-reduced-motion:no-preference){.pulse{animation:p 2.4s ease-out infinite;transform-origin:center;transform-box:fill-box}@keyframes p{0%{transform:scale(1);opacity:.55}100%{transform:scale(3.2);opacity:0}}}
</style>
</head>
<body>
<div class="top"><button class="logo" data-a="home" aria-label="Accueil Escale"><i></i>Escale</button><span class="sp"></span><span class="sync" id="sync"></span><button class="btn s g" data-a="settings">Réglages</button></div>
<main class="wrap" id="app"><p class="load">Chargement de tes voyages…</p></main>
<div class="ov" id="ov" role="dialog" aria-modal="true"><div class="md" id="md"></div></div>
<div class="toast" id="toast" role="status"></div>
<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const todayISO=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};
const nowHM=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const diffDays=(a,b)=>Math.round((new Date(b+'T00:00:00Z')-new Date(a+'T00:00:00Z'))/864e5);
const fmtD=(s,o)=>s?new Date(s+'T00:00:00Z').toLocaleDateString('fr-FR',Object.assign({weekday:'short',day:'numeric',month:'short'},o||{},{timeZone:'UTC'})):'';
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
const days=t=>{const a=[];if(!t.start||!t.end)return a;let d=t.start;while(d<=t.end&&a.length<120){a.push(d);d=addDays(d,1)}return a};
const fmtMin=m=>m<60?Math.round(m)+' min':Math.floor(m/60)+' h'+(Math.round(m%60)?' '+String(Math.round(m%60)).padStart(2,'0'):'');
const CATS={resto:{l:'Resto',c:'#e2401f',d:60},bar:{l:'Bar',c:'#b0399b',d:60},boutique:{l:'Boutique',c:'#d08f00',d:30},visite:{l:'Visite',c:'#1d55cf',d:90},activite:{l:'Activité',c:'#13916a',d:120},autre:{l:'Autre',c:'#7a7a82',d:45}};
const BT={vol:'Vol',train:'Train',bus:'Bus',bateau:'Bateau',hotel:'Hébergement',activite:'Activité réservée',location:'Location',autre:'Autre'};
const WANT=[['all','Tout'],['resto','Manger'],['bar','Boire un verre'],['visite','Visiter'],['activite','Activité'],['boutique','Shopping']];
const MINS=[[30,'30 min'],[60,'1 h'],[120,'2 h'],[180,'3 h'],[360,'Demi-journée']];
const LS='escale.trips.v1';

const S={deleted:{},follow:[],view:'home',tripId:null,tab:'prep',sub:'prog',f:{cat:'all',st:'all',city:'all',q:''},now:{day:null,at:'',mins:120,want:'all',custom:''},sug:null,sample:null,recap:null};
const W={};

/* ---------- stockage : sur l'appareil + serveur (sans compte) ---------- */
const LSD='escale.deleted.v1',MEK='escale.me',FOL='escale.follow';
const rnd=n=>{const a=new Uint8Array(n);crypto.getRandomValues(a);return[...a].map(x=>'abcdefghijklmnopqrstuvwxyz0123456789'[x%36]).join('')};
const lsGet=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||'null')||d}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const lsLoad=()=>lsGet(LS,{});
const lsSave=()=>{lsSet(LS,S.trips);lsSet(LSD,S.deleted)};
let ME=lsGet(MEK,null);if(!ME||!ME.id){ME={id:rnd(12),secret:rnd(28)};lsSet(MEK,ME)}
async function api(path,body){const r=await fetch(path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j.error||('Erreur '+r.status));e.status=r.status;throw e}return j}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2800)}
const SY={tm:null,busy:false,again:false};
function syncLabel(m){const e=$('#sync');if(e)e.textContent=m}
function save(t){t.updated=Date.now();S.trips[t.id]=t;lsSave();pushLive(t);schedulePush()}
function schedulePush(){clearTimeout(SY.tm);syncLabel('Enregistrement…');SY.tm=setTimeout(pushNow,1500)}
async function pushNow(){if(SY.busy){SY.again=true;return}SY.busy=true;SY.again=false;
 try{await api('/api/me',{op:'put',id:ME.id,secret:ME.secret,doc:{trips:S.trips,deleted:S.deleted}});syncLabel('Sauvegardé')}
 catch(e){syncLabel(navigator.onLine===false?'Hors ligne · enregistré ici':'Enregistré sur ce téléphone');SY.retry=true}
 SY.busy=false;if(SY.again)pushNow()}
function merge(doc){let changed=false,need=false;const st=doc.trips||{},dl=doc.deleted||{};
 Object.entries(dl).forEach(([id,ts])=>{if(!S.deleted[id]||S.deleted[id]<ts){S.deleted[id]=ts}if(S.trips[id]&&(S.trips[id].updated||0)<ts){delete S.trips[id];changed=true}});
 Object.values(st).forEach(t=>{if(!t||!t.id||S.deleted[t.id]>=(t.updated||0))return;const l=S.trips[t.id];if(!l||(t.updated||0)>(l.updated||0)){S.trips[t.id]=t;changed=true}else if((l.updated||0)>(t.updated||0))need=true});
 Object.keys(S.trips).forEach(id=>{if(!st[id])need=true});Object.keys(S.deleted).forEach(id=>{if(!dl[id])need=true});
 if(changed)lsSave();return{changed,need}}
async function pull(){try{const r=await api('/api/me',{op:'get',id:ME.id,secret:ME.secret});const m=merge(r.doc);syncLabel('Sauvegardé');if(m.need)schedulePush();
  if(m.changed&&!$('#ov').classList.contains('on')&&!(document.activeElement&&document.activeElement.matches('input,textarea,select')))render()}
 catch(e){if(e.status===404){if(Object.keys(S.trips).length)schedulePush();else syncLabel('')}else syncLabel(navigator.onLine===false?'Hors ligne':'')}}
function removeTrip(id){delete S.trips[id];S.deleted[id]=Date.now();lsSave();schedulePush()}
async function uploadFile(f){const meta=await photoMeta(f),b=await shrink(f);let type=(b.type||f.type||'').toLowerCase();if(!type&&/\.pdf$/i.test(f.name))type='application/pdf';if(!type&&/\.(heic|heif)$/i.test(f.name))type='image/heic';
 const r=await fetch('/api/upload',{method:'POST',headers:{'Content-Type':type||'application/octet-stream','x-escale-id':ME.id},body:b});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Envoi impossible');

 const vis=[...new Set(pts.map(at).filter(Boolean))];if(!vis.length)return;const nc=document.getElementById('ncountries'),cn=document.getElementById('cnames'),nl=document.getElementById('nclab');if(nc)nc.textContent=vis.length;if(nl)nl.textContent='pays';if(cn)cn.textContent=vis.map(f=>FR[f.properties.name]||f.properties.name).join(' · ')})}
async function drawMap(el,data){if(!data||!data.pts.length)return;countCountries(data.pts);const L=await leaflet();if(!el.isConnected)return;const box=el.querySelector('.lf');if(!L||!box){el.insertAdjacentHTML('beforeend','<span class="cap" style="left:auto;right:12px">Carte indisponible hors connexion</span>');return}

 for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];if(km(a,b)>300){const dx=b.lng-a.lng,dy=b.lat-a.lat,o=.18,c=[(a.lat+b.lat)/2+dx*o,(a.lng+b.lng)/2-dy*o],arc=[];for(let k=0;k<=24;k++){const t=k/24,u=1-t;arc.push([u*u*a.lat+2*u*t*c[0]+t*t*b.lat,u*u*a.lng+2*u*t*c[1]+t*t*b.lng])}L.polyline(arc,{color:red,weight:2.5,dashArray:'1 8',lineCap:'round'}).addTo(m)}

 <select data-c="fst" aria-label="Statut">${[['all','Tous statuts'],['wish','Wishlist (sans date)'],['plan','Au programme'],['res','Réservées'],['must','Incontournables']].map(([k,v])=>`<option value="${k}"${f.st===k?' selected':''}>${v}</option>`).join('')}</select>

/* ---------- sur place ---------- */
function spots(t,d){const out=[],seen=new Set();const push=(k,o,label)=>{if(!hasG(o)||seen.has(k+o.id))return;seen.add(k+o.id);out.push({v:k+':'+o.id,label,lat:o.lat,lng:o.lng})};
 stepsSorted(t).filter(s=>s.date===d).reverse().forEach(s=>push('s',s,'Étape · '+(s.time?s.time+' · ':'')+s.name));dayItems(t,d).forEach(x=>push(x.k,x.o,(x.time?x.time+' · ':'')+x.title));const h=hotelNight(t,d)||hotelNight(t,addDays(d,-1));if(h)push('b',h,'Hôtel · '+h.title);
 const c=cityOf(t,d).toLowerCase();(t.places||[]).filter(p=>p.city&&c.includes(p.city.toLowerCase())).forEach(p=>push('p',p,p.name));
 (t.places||[]).forEach(p=>push('p',p,p.name+(p.city?' ('+p.city+')':'')));return out}
function herePos(t,d){if(S.now.at==='gps')return S.now.gps||null;if(S.now.at==='custom')return parseGeo(S.now.custom);if(!S.now.at&&S.now.gps&&Date.now()-S.now.gps.t<20*60000){S.now.at='gps';return S.now.gps}const sp=spots(t,d);let s=sp.find(x=>x.v===S.now.at);
 if(!s){const st=stepsSorted(t).filter(x=>x.date===d&&hasG(x));if(st.length)s=sp.find(x=>x.v==='s:'+st[st.length-1].id)}if(!s){const done=(t.places||[]).filter(p=>p.visited&&p.visitedOn===d&&hasG(p));s=done.length?sp.find(x=>x.v==='p:'+done[done.length-1].id):sp[0];if(s)S.now.at=s.v}return s?{lat:s.lat,lng:s.lng}:null}
function nextUp(t,d){if(d!==todayISO())return null;const n=nowHM();return dayItems(t,d).find(x=>x.time&&x.time>n&&!(x.k==='p'&&x.o.visited))||null}
function candidates(t,d,here){const c=cityOf(t,d).toLowerCase(),want=S.now.want;
 return(t.places||[]).filter(p=>!p.visited&&(!p.date||p.date===d)&&(want==='all'||p.cat===want)).map(p=>{const dur=+p.dur||CATS[p.cat].d;
  if(here&&hasG(p)){const k=km(here,p);if(k>25)return null;const tr=travel(k);return{p,k,tr,dur,need:tr.min+dur}}
  if(p.city&&c.includes(p.city.toLowerCase()))return{p,k:null,tr:null,dur,need:dur};return null}).filter(Boolean)
  .filter(x=>x.need<=S.now.mins+5).sort((a,b)=>(b.p.must?1:0)-(a.p.must?1:0)||(a.k??99)-(b.k??99)).slice(0,8)}
function renderNow(t){const ds=days(t),td=todayISO();if(!ds.length)return'<div class="empty">Ajoute des dates au voyage.</div>';
 if(!S.now.day||!ds.includes(S.now.day))S.now.day=ds.includes(td)?td:ds[0];const d=S.now.day;
 const it=dayItems(t,d),tickets=(t.bookings||[]).filter(b=>b.date===d||(b.type==='hotel'&&b.date<=d&&(b.endDate||b.date)>=d));
 const here=herePos(t,d),nu=nextUp(t,d);
 if(nu&&!S.now.touched){const m=(+nu.time.slice(0,2)*60+ +nu.time.slice(3))-(new Date().getHours()*60+new Date().getMinutes());S.now.mins=MINS.reduce((a,b)=>Math.abs(b[0]-m)<Math.abs(a[0]-m)?b:a)[0]}
 const res=candidates(t,d,here);S.res=res;
 const sp=spots(t,d);
 return`${ds.includes(td)?'':`<p class="hint">Le voyage n’a pas commencé ou est terminé : aperçu du ${fmtD(d)}.</p>`}
 <div class="scroll" role="tablist" aria-label="Jour">${ds.map((x,i)=>`<button class="chip" aria-pressed="${x===d}" data-a="nowDay" data-v="${x}">${x===td?'Aujourd’hui':'J'+(i+1)+' · '+fmtD(x,{weekday:undefined,month:'short'})}</button>`).join('')}</div>
 <div class="card day"><header><b>${cap(fmtD(d,{month:'long'}))}</b><small>${esc(cityOf(t,d))}</small><button class="btn s g" data-a="addToDay" data-v="${d}">+ Plan</button></header>
 <ol class="items">${it.map(x=>itemHTML(t,x,{notes:true})).join('')||'<li class="it night"><time></time><span></span><small>Rien de prévu : demande à « What now ? »</small></li>'}</ol>
 ${(t.dayNote||{})[d]?`<p class="note">${esc(t.dayNote[d])}</p>`:''}</div>
 <div class="row" style="margin:14px 0"><button class="btn r" data-a="addStep">Publier une étape</button><span class="hint" style="margin:0;flex:1;min-width:200px">Photos, lieu, récit : ça trace ta carte${t.live?' et tes amis le voient en direct':''}.</span></div>
 ${(()=>{const st=stepsSorted(t).filter(s=>s.date===d);return st.length?'<h2>Étapes du jour</h2>'+stepsHTML(st,true):''})()}
 ${tickets.length?`<h2>Billets & réservations du jour</h2><div class="scroll">${tickets.map(b=>`<button class="btn g" data-a="ticket" data-v="${b.id}">${esc(bTitle(b))}${b.ref?' · '+esc(b.ref):''}</button>`).join('')}</div>`:''}
 <section class="now" aria-labelledby="wn"><h2 id="wn">What now ?</h2><div style="opacity:.8;font-size:15px">${nu?`Prochain rendez-vous : <b>${esc(nu.title)}</b> à ${esc(nu.time)}.`:'Un trou dans la journée ? Voici tes adresses enregistrées qui tiennent dans ce temps.'}</div>
 <div class="g2"><div><label class="f" for="at">Je suis à</label><select id="at" data-c="nowAt"><option value="gps"${S.now.at==='gps'?' selected':''}>${S.now.gps?'Ma position GPS':'Ma position GPS (me localiser)'}</option>${sp.map(s=>`<option value="${esc(s.v)}"${s.v===S.now.at?' selected':''}>${esc(s.label)}</option>`).join('')}<option value="custom"${S.now.at==='custom'?' selected':''}>Autre position (lien Maps ou coordonnées)…</option></select></div>
 <div>${S.now.at==='custom'||!sp.length?`<label class="f" for="cu">Lien Google Maps ou « lat, lng »</label><input id="cu" data-c="nowCustom" value="${esc(S.now.custom)}" placeholder="13.7465, 100.4927">`:`<label class="f">&nbsp;</label><button class="btn r" data-a="locate" style="width:100%">${S.now.locating?'Localisation…':'Me localiser'}</button>`}</div></div>
 <label class="f">J’ai</label><div class="row">${MINS.map(([m,l])=>`<button class="chip" aria-pressed="${S.now.mins===m}" data-a="mins" data-v="${m}">${l}</button>`).join('')}</div>
 <label class="f">Envie de</label><div class="row">${WANT.map(([k,l])=>`<button class="chip" aria-pressed="${S.now.want===k}" data-a="want" data-v="${k}">${l}</button>`).join('')}</div>
 ${here?'<div class="fig" id="radar" aria-label="Radar des adresses autour de toi"><svg></svg></div>':'<p class="hint" style="color:inherit;opacity:.8">Touche « Me localiser » ou choisis où tu es pour voir les distances.</p>'}
 ${res.length?res.map((x,i)=>`<div class="res"><span class="n" style="background:${CATS[x.p.cat].c}">${i+1}</span><div><b>${esc(x.p.name)}</b> ${x.p.must?'<span class="tag must">Incontournable</span>':''}<div class="note">${CATS[x.p.cat].l}${x.p.area?' · '+esc(x.p.area):''} · sur place ~${fmtMin(x.dur)}</div>
 <div><span class="trav">${x.tr?fmtMin(x.tr.min)+' '+x.tr.how:'distance inconnue'}</span>${x.k!=null?' <small>('+(x.k<1?Math.round(x.k*1000)+' m':x.k.toFixed(1)+' km')+')</small>':''}</div>${x.p.note?`<div class="note">${esc(x.p.note)}</div>`:''}
 <div class="act"><button class="btn s p" data-a="go" data-v="${x.p.id}">J’y vais</button><a class="btn s g" href="${mapsUrl(x.p)}" target="_blank" rel="noopener">Itinéraire</a><button class="btn s g" data-a="done" data-v="${x.p.id}">Déjà fait</button></div></div></div>`).join('')
 :`<p style="margin:16px 0 6px">Aucune adresse enregistrée ne tient dans ${fmtMin(S.now.mins)} ici.</p>`}
 ${S.sample&&here?`<div style="margin-top:14px"><button class="btn r" data-a="more">${S.now.want==='resto'?'Plus de restos autour de moi':'Plus d’idées autour de moi'}</button><div class="hint" style="color:inherit;opacity:.75">Suggestions de l’IA, en plus de tes adresses. Vérifie horaires et avis avant d’y aller.</div></div>`:''}
 ${S.sug?renderSug():''}</section>`}
function renderSug(){if(S.sug==='load')return'<p style="margin-top:12px">Recherche d’idées à proximité…</p>';if(!S.sug.length)return'<p style="margin-top:12px">Pas de suggestion trouvée.</p>';
 return'<h3 style="margin:16px 0 4px">Autres idées à proximité</h3>'+S.sug.map((s,i)=>`<div class="res"><span class="n" style="background:var(--panel2);color:var(--ink)">+</span><div><b>${esc(s.name)}</b><div class="note">${esc((CATS[s.cat]||CATS.autre).l)}${s.area?' · '+esc(s.area):''}${s.trav?' · '+esc(s.trav):''}</div>${s.why?`<div class="note">${esc(s.why)}</div>`:''}<div class="act"><button class="btn s p" data-a="addSug" data-v="${i}">Ajouter à mes adresses</button><a class="btn s g" href="${mapsUrl(s)}" target="_blank" rel="noopener">Voir sur Maps</a></div></div></div>`).join('')}

/* ---------- radar ---------- */
let RO=null;
function afterRender(){const f=$('#radar'),m=$('#map');if(RO){RO.disconnect();RO=null}if(m)drawMap(m,S.mapData);if(!f)return;RO=new ResizeObserver(()=>drawRadar(f));RO.observe(f)}
function drawRadar(f){const s=f.querySelector('svg'),W=f.clientWidth,H=f.clientHeight;if(!W)return;const t=T(),here=herePos(t,S.now.day);if(!here){s.innerHTML='';return}
 const res=(S.res||[]).filter(x=>x.k!=null),R=Math.min(W,H)/2-26,cx=W/2,cy=H/2;
 const maxK=Math.max(.6,...res.map(x=>x.k))*1.08,sc=R/maxK,cos=Math.cos(here.lat*Math.PI/180);
 const ink='currentColor';let g='';
 const rings=[.25,.5,.75,1].map(f=>f*maxK);
 rings.forEach((r,i)=>{g+=`<circle cx="${cx}" cy="${cy}" r="${r*sc}" fill="none" stroke="${ink}" stroke-opacity="${i===3?.35:.18}" stroke-dasharray="${i===3?'':'3 5'}"/>`});
 const lab=r=>{const m=travel(r).min;return(r<1?Math.round(r*1000)+' m':r.toFixed(1)+' km')+(W>420?' · '+fmtMin(m):'')};
 [1,3].forEach(i=>{const r=rings[i]*sc;g+=`<text x="${cx+4}" y="${cy-r-5}" font-size="12" fill="${ink}" fill-opacity=".6">${lab(rings[i])}</text>`});
 g+=`<line x1="${cx}" y1="${cy-R-8}" x2="${cx}" y2="${cy-R+6}" stroke="${ink}" stroke-opacity=".5"/><text x="${cx}" y="${cy-R-12}" text-anchor="middle" font-size="11" font-weight="700" fill="${ink}" fill-opacity=".6">N</text>`;
 (S.res||[]).forEach((x,i)=>{if(x.k==null)return;const dx=(x.p.lng-here.lng)*cos*111.32,dy=(x.p.lat-here.lat)*110.57;const px=cx+dx*sc,py=cy-dy*sc,col=CATS[x.p.cat].c;
  g+=`<line x1="${cx}" y1="${cy}" x2="${px}" y2="${py}" stroke="${col}" stroke-opacity=".35"/><circle cx="${px}" cy="${py}" r="13" fill="${col}"/><circle cx="${px-3}" cy="${py-3}" r="4" fill="#fff" fill-opacity=".25"/><text x="${px}" y="${py+4.5}" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">${i+1}</text>`});
 g+=`<circle class="pulse" cx="${cx}" cy="${cy}" r="9" fill="var(--red)"/><circle cx="${cx}" cy="${cy}" r="9" fill="var(--red)" stroke="var(--pass)" stroke-width="3"/><text x="${cx}" y="${cy+26}" text-anchor="middle" font-size="12" font-weight="700" fill="${ink}">toi</text>`;
 s.setAttribute('viewBox',`0 0 ${W} ${H}`);s.innerHTML=g}

/* ---------- souvenirs & récap ---------- */
const stars=n=>n?'<span class="stars" aria-label="'+n+' sur 5">'+'★'.repeat(n)+'<span style="opacity:.25">'+'★'.repeat(5-n)+'</span></span>':'';
function renderMemo(t){const subs=[['journal','Carte & carnet'],['notes','Noter mes adresses'],['recap','Mon récap']];if(!['journal','notes','recap'].includes(S.sub))S.sub=phase(t)==='apres'?'recap':'journal';
 let h=`<div class="subs">${subs.map(([k,n])=>`<button class="chip" aria-pressed="${S.sub===k}" data-a="sub" data-v="${k}">${n}</button>`).join('')}</div>`;
 if(S.sub==='recap')return h+`<div class="recap">${recapHTML(recapData(t),true)}</div>`;
 if(S.sub==='journal')return h+journalHTML(t);
 const ps=(t.places||[]),done=ps.filter(p=>p.visited),todo=ps.filter(p=>!p.visited&&(p.date&&p.date<=todayISO()));
 const rest=ps.filter(p=>!p.visited&&!todo.includes(p));
 const row=p=>placeRow(p,`<button class="btn s ${p.visited?'p':'g'}" data-a="memo" data-v="${p.id}">${p.visited?'Modifier':'Noter'}</button>`)+(p.visited&&(p.rating||p.comment||p.fav||(p.photos||[]).length)?`<div style="padding:0 0 10px 24px">${p.fav?'<span class="tag must">Coup de cœur</span> ':''}${stars(p.rating)}${p.comment?`<div class="note" style="color:var(--ink)">« ${esc(p.comment)} »</div>`:''}${photoHTML(p.photos)}</div>`:'');
 return h+`<div class="row" style="justify-content:space-between;margin-top:8px"><h2 style="margin:0">Où es-tu allé ?</h2><button class="btn r s" data-a="addDiscovery">+ Découverte sur place</button></div>
 <p class="hint">Note, commente et ajoute des photos. Ton récap se construit tout seul à partir d’ici.</p>
 ${done.length?'<h3 style="margin-top:16px">Faits ('+done.length+')</h3><div class="card" style="padding-top:2px">'+done.map(row).join('')+'</div>':''}
 ${todo.length?'<h3 style="margin-top:16px">Prévus, à confirmer</h3><div class="card" style="padding-top:2px">'+todo.map(row).join('')+'</div>':''}
 ${rest.length?'<h3 style="margin-top:16px">Pas encore faits</h3><div class="card" style="padding-top:2px">'+rest.map(row).join('')+'</div>':''}
 ${ps.length?'':'<div class="empty">Ajoute des adresses pour pouvoir les noter.</div>'}`}
function photoHTML(ph){return(ph||[]).length?'<div class="photos">'+ph.map(f=>`<img src="${esc(fileUrl(f))}" alt="" loading="lazy">`).join('')+'</div>':''}
function recapData(t){const vis=(t.places||[]).filter(p=>p.visited);
 return{name:t.name,dest:t.dest,start:t.start,end:t.end,dayCity:Object.assign({},...days(t).map(d=>({[d]:cityOf(t,d)}))),
  places:vis.map(p=>({name:p.name,cat:p.cat,city:p.city||'',area:p.area||'',lat:p.lat??null,lng:p.lng??null,link:p.link||'',dur:p.dur||'',on:p.visitedOn||p.date||'',time:p.time||'',rating:p.rating||0,fav:!!p.fav,comment:p.comment||'',photos:(p.photos||[]).map(f=>({url:fileUrl(f)}))})),
  steps:stepsSorted(t).map(s=>({id:s.id,name:s.name||'',lat:s.lat??null,lng:s.lng??null,date:s.date||'',time:s.time||'',text:s.text||'',photos:(s.photos||[]).map(f=>({url:fileUrl(f)}))})),live:!!t.live}}
function recapHTML(r,own){const ds=[];if(r.start&&r.end){let d=r.start;while(d<=r.end&&ds.length<120){ds.push(d);d=addDays(d,1)}}
 const P=r.places||[],favs=P.filter(p=>p.fav||p.rating>=4).sort((a,b)=>(b.fav-a.fav)||(b.rating-a.rating));
 const cities=[...new Set(P.map(p=>p.city).filter(Boolean))],photos=P.flatMap(p=>p.photos||[]);
 const ST=r.steps||[],SL=ST.filter(hasG);let mp=SL.length?{pts:SL.map((s,i)=>({lat:s.lat,lng:s.lng,photo:(s.photos||[])[0]||null,label:s.name,sid:s.id||'r'+ST.indexOf(s)})),planned:false}:{pts:P.filter(hasG).sort((a,b)=>((a.on||'')+(a.time||''))<((b.on||'')+(b.time||''))?-1:1).map(p=>({lat:p.lat,lng:p.lng,photo:(p.photos||[])[0]||null,label:p.name})),planned:false};S.mapData=mp;
 if(!P.length&&!ST.length)return`<div class="empty" style="margin-top:12px">${own?'Ton récap se remplira quand tu marqueras des adresses comme faites (onglet « Noter mes adresses » ou « Déjà fait » sur place). Il reprendra ton itinéraire réel jour par jour, tes notes, coups de cœur et photos.':'Ce récap est vide.'}</div>`;
 const byDay=ds.map((d,i)=>({d,i,c:(r.dayCity||{})[d]||'',ps:P.filter(p=>p.on===d).sort((a,b)=>(a.time||'99')<(b.time||'99')?-1:1)})).filter(x=>x.ps.length||x.c);
 const nod=P.filter(p=>!p.on||!ds.includes(p.on));
 const pl=p=>`<div class="pl"><span class="dot" style="color:${(CATS[p.cat]||CATS.autre).c}"></span><div><b>${esc(p.name)}</b> ${p.fav?'<span class="tag must">Coup de cœur</span>':''}<div class="note">${(CATS[p.cat]||CATS.autre).l}${p.area?' · '+esc(p.area):''} ${stars(p.rating)}</div>${p.comment?`<div class="note" style="color:var(--ink)">« ${esc(p.comment)} »</div>`:''}${photoHTML(p.photos)}</div><a class="btn s g" href="${mapsUrl(p)}" target="_blank" rel="noopener">Maps</a></div>`;

 async gpsFill(v,b,e,quiet){const i=document.getElementById(v);if(!i)return;const h=$('#gpsHint');if(!quiet&&h)h.textContent='Localisation…';try{const p=await gps();if(!document.getElementById(v))return;if(quiet&&i.value)return;i.value=p.lat.toFixed(5)+', '+p.lng.toFixed(5);if(h)h.textContent='Position GPS utilisée'+(p.acc>150?' (précision ~'+Math.round(p.acc)+' m)':'')+'.'}catch(x){if(!quiet)toast(x.message)}},
 settings(){openModal('Réglages',`<h3>Retrouver tes voyages ailleurs</h3><p class="mute" style="margin-top:4px">Pas de compte : tes voyages sont liés à ce code. Garde-le (note, mail à toi-même) pour les retrouver sur un autre téléphone ou après avoir vidé ton navigateur.</p>
  <div class="ticket"><div class="ref" style="font-size:clamp(16px,4.6vw,22px);letter-spacing:.02em">${esc(ME.id+'-'+ME.secret)}</div></div><div class="row" style="margin-top:8px"><button type="button" class="btn s" data-a="copyMe">Copier mon code</button></div>
  <label class="f" for="rc">Utiliser un code existant sur ce téléphone</label><input id="rc" name="code" placeholder="Colle ton code de récupération" autocomplete="off">
  <label class="f" for="pf">Tes préférences de voyage (pour les suggestions)</label><input id="pf" name="prefs" value="${esc(lsGet('escale.prefs',''))}" placeholder="ex. pas trop épicé, pas de vertige, petit budget">
  <h3 style="margin-top:22px">L’appli sur ton téléphone</h3><p class="mute" style="margin-top:4px">${/iphone|ipad/i.test(navigator.userAgent)?'Sur iPhone : bouton Partager de Safari, puis « Sur l’écran d’accueil ».':'Menu du navigateur, puis « Installer l’application » ou « Ajouter à l’écran d’accueil ».'}</p>${S.bip?'<button type="button" class="btn s r" data-a="install">Installer Escale</button>':''}`,async fd=>{
   lsSet('escale.prefs',fd.get('prefs').trim());const c=String(fd.get('code')||'').trim().toLowerCase();if(!c)return;const m=c.match(/^([a-z0-9]{8,40})-([a-z0-9]{16,64})$/);if(!m){toast('Code non reconnu');return false}
   try{const r=await api('/api/me',{op:'get',id:m[1],secret:m[2]});ME={id:m[1],secret:m[2]};lsSet(MEK,ME);merge(r.doc);schedulePush();toast('Voyages récupérés')}catch(e){toast(e.status===404?'Aucun voyage pour ce code':'Pas de connexion : réessaie.');return false}})},
 copyMe(){copy(ME.id+'-'+ME.secret,'Code copié : garde-le précieusement')},
 async install(){if(!S.bip)return;S.bip.prompt();try{await S.bip.userChoice}catch(e){}S.bip=null;closeModal();render()},
 dismissInstall(){lsSet('escale.noinstall',1);render()},
 close:closeModal,
 rmFile(v){M.files.splice(+v,1);$('#upl').innerHTML=upList()}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;if(b.tagName==='A')return;const f=A[b.dataset.a];if(!f)return;e.preventDefault();f(b.dataset.v,b,e)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#ov').classList.contains('on'))closeModal();if(e.key==='Enter'&&e.target.matches('li[data-a]'))e.target.click()});
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')closeModal()});
document.addEventListener('submit',async e=>{e.preventDefault();if(e.target.id==='codeForm'){openRecap(e.target.elements.namedItem('code').value);return}
 if(e.target.id==='mf'&&M.submit){const r=await M.submit(new FormData(e.target));if(r===false)return;closeModal();render()}});
document.addEventListener('change',async e=>{const el=e.target,c=el.dataset.c;
 if(el.dataset.up){const fs=[...el.files],box=$('#upl'),got=[];el.disabled=true;
  for(const f of fs){if(box)box.insertAdjacentHTML('beforeend','<div class="hint">Envoi de '+esc(f.name)+'…</div>');try{const e=await uploadFile(f);if(!M.files)return;M.files.push(e);got.push(e)}catch(x){toast((x.message||'Envoi impossible')+' : '+f.name)}}
  if(!$('#upl'))return;el.value='';el.disabled=false;$('#upl').innerHTML=upList();if(M.onPhotos&&got.length)M.onPhotos(got);return}
 if(!c)return;const t=T();
 if(c==='dayCity'||c==='dayNote'){t[c]=t[c]||{};const v=el.value.trim();if(v)t[c][el.dataset.v]=v;else delete t[c][el.dataset.v];save(t);if(c==='dayCity')render();return}
 if(c==='fcat')S.f.cat=el.value;if(c==='fst')S.f.st=el.value;if(c==='fcity')S.f.city=el.value;
 if(c==='nowAt'){S.now.at=el.value;S.sug=null}if(c==='nowCustom'){S.now.custom=el.value;S.now.at='custom';S.sug=null}
 if(c==='bkType')return;render()});
let qT;document.addEventListener('input',e=>{if(e.target.dataset.c==='fq'){S.f.q=e.target.value;clearTimeout(qT);qT=setTimeout(()=>{const pos=e.target.selectionStart;render();const i=document.querySelector('[data-c=fq]');if(i){i.focus();try{i.setSelectionRange(pos,pos)}catch(x){}}},250)}});
addEventListener('popstate',()=>{const m=location.pathname.match(/^\/v\/([a-z0-9]{6,12})/i);if(m){if(!(S.view==='recapShared'&&S.rc===m[1]))openRecap(m[1])}else if(S.view==='recapShared'){S.view='home';stopFollow();render()}});

/* ---------- démarrage ---------- */
S.trips=lsLoad();S.deleted=lsGet(LSD,{});S.follow=lsGet(FOL,[]);S.standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
{const m=location.pathname.match(/^\/v\/([a-z0-9]{6,12})/i)||location.hash.match(/^#(?:v|recap)-([a-z0-9]{6,12})/i);if(m)openRecap(m[1]);else render()}
pull();fetch('/api/config').then(r=>r.json()).then(c=>{if(c&&c.ai){S.sample=true;if(S.view==='trip')render()}}).catch(()=>{});
addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){pull();if(SY.retry){SY.retry=false;schedulePush()}}});
addEventListener('online',()=>schedulePush());
addEventListener('beforeinstallprompt',e=>{e.preventDefault();S.bip=e;if(S.view==='home')render()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
}
</script>
