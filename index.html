<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Escale — ton carnet de voyage</title>
<meta name="description" content="Prépare ton voyage, vis-le avec « What now ? », partage ton carnet de route en direct.">
<meta property="og:title" content="Escale — carnet de voyage"><meta property="og:description" content="Programme, billets, adresses, carnet de route et carte à suivre en direct.">
<meta name="theme-color" content="#0F3D3E"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><link rel="icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Escale">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: carnet de voyage ensoleillé, photo d'abord, pensé pour le téléphone sur place (piste B).
   IDEA: le carnet photo — chaque journée s'ouvre sur une image, les infos glissent par-dessus sur une feuille.
   PICTURE: photo de la journée en tête ; carte du parcours en tête du carnet ; plan/radar dans What now.
   COLOUR and TYPE: blanc, bleu canard #0F3D3E (encre), jaune soleil #FFC43D, corail #FF6A4D ; Plus Jakarta Sans 800/600.
   LAYOUT: colonne 760px, barre de navigation en bas (Voyage, Aujourd'hui, +, Adresses, Carnet), feuilles arrondies. */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0b1f20);--panel:light-dark(#f1f6f5,#14302f);--panel2:light-dark(#e2ecea,#1d3d3c);
--ink:light-dark(#0f3d3e,#eaf4f2);--mute:light-dark(#5b6e6f,#9fb6b4);--line:light-dark(#d5e1df,#2a4a49);
--red:light-dark(#ff6a4d,#ff8a72);--sun:#ffc43d;--teal:#0f3d3e;--blue:light-dark(#2f80ed,#7fb2ff);--pass:light-dark(#0f3d3e,#eaf4f2);--passInk:light-dark(#ffffff,#0f3d3e);--sea:light-dark(#bfe3ec,#123040);--land:light-dark(#fff7e6,#22403f);--land2:light-dark(#ffd8c9,#5a3a2c);--shadow:0 4px 18px rgba(15,61,62,.09)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Plus Jakarta Sans',system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 96px}
.top{display:flex;align-items:center;gap:12px;padding:14px 16px;max-width:760px;margin:0 auto}
.logo{font-weight:800;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;cursor:pointer;background:none;border:0;padding:0}
.logo i{width:22px;height:22px;border-radius:50%;background:var(--red);display:inline-block;box-shadow:inset -6px -6px 0 rgba(0,0,0,.18)}
.top .sp{flex:1}
.sync{font-size:13px;color:var(--mute)}
h1{font-size:clamp(30px,7vw,46px);line-height:1.04;letter-spacing:-.025em;margin:0;font-weight:800;text-wrap:balance}
h2{font-size:22px;line-height:1.15;margin:28px 0 12px;font-weight:800;letter-spacing:-.01em}
h3{font-size:17px;margin:0;font-weight:700}
small,.mute{color:var(--mute)}
.btn{min-height:44px;padding:0 18px;border-radius:99px;border:1.5px solid var(--ink);background:transparent;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.p{background:var(--ink);color:var(--bg)}
.btn.r{background:var(--red);border-color:var(--red);color:#fff}
.btn.s{min-height:36px;padding:0 14px;font-size:14px;border-radius:99px;border-width:1px}
.btn.g{border-color:var(--line)}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.card:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{min-height:40px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:15px;font-weight:600;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip{border-color:var(--line)}
.scroll{overflow-x:auto;display:flex;gap:8px;padding-bottom:6px;scrollbar-width:thin}
.scroll>*{flex:none}
input,select,textarea{width:100%;min-height:44px;border:1px solid var(--line);border-radius:14px;background:var(--bg);padding:9px 12px;font-size:16px}
textarea{min-height:80px;resize:vertical}
label.f{display:block;font-size:14px;font-weight:600;margin:12px 0 4px}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 12px}
.empty{border:1.5px dashed var(--line);border-radius:16px;padding:22px;text-align:center;color:var(--mute)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none;background:currentColor}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--panel2);white-space:nowrap}
.tag.res{background:var(--teal);color:#fff}.tag.must{background:var(--sun);color:var(--teal)}
/* billet */
.pass{background:var(--pass);color:var(--passInk);border-radius:22px;padding:22px 22px 18px;position:relative;overflow:hidden;margin-top:6px}
.pass:before,.pass:after{content:"";position:absolute;width:26px;height:26px;border-radius:50%;background:var(--bg);top:calc(100% - 64px)}
.pass:before{left:-13px}.pass:after{right:-13px}
.pass .ph{font-size:14px;font-weight:700;color:var(--red);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pass h1{margin:6px 0 4px}
.route{display:flex;align-items:flex-start;margin:18px 0 22px;position:relative}
.route:before{content:"";position:absolute;left:6px;right:6px;top:6px;border-top:2px dashed currentColor;opacity:.45}
.stop{flex:1;position:relative;font-size:13px;font-weight:700;padding-top:20px;text-align:center;overflow-wrap:anywhere}
.stop:first-child{text-align:left}.stop:last-child{text-align:right}
.stop:before{content:"";position:absolute;top:0;left:50%;margin-left:-7px;width:14px;height:14px;border-radius:50%;background:var(--passInk);border:3px solid var(--pass);box-shadow:0 0 0 2px var(--passInk)}
.stop:first-child:before{left:0;margin:0}.stop:last-child:before{left:auto;right:0;margin:0}
.stop.on:before{background:var(--red);box-shadow:0 0 0 2px var(--red)}
.meta{border-top:2px dashed currentColor;border-color:color-mix(in srgb,var(--passInk) 35%,transparent);padding-top:14px;display:flex;gap:18px;flex-wrap:wrap;font-size:14px}
.meta b{display:block;font-size:20px}
.pass .edit{position:absolute;right:14px;top:14px;color:var(--passInk);border-color:color-mix(in srgb,var(--passInk) 40%,transparent)}
/* onglets */
.tabs{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 10px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.tab{min-height:48px;border-radius:12px;border:0;background:var(--panel);font-weight:800;cursor:pointer;font-size:15px;line-height:1.1;padding:4px}
.tab small{display:block;font-weight:500;font-size:12px}
.tab[aria-selected=true]{background:var(--ink);color:var(--bg)}.tab[aria-selected=true] small{color:#fff}
.subs{display:flex;gap:6px;margin:4px 0 6px;flex-wrap:wrap}
/* cartes */
.card{background:var(--panel);border-radius:20px;padding:14px 16px;margin:10px 0}
.trip{display:flex;gap:14px;align-items:center;cursor:pointer;border:0;width:100%;text-align:left;font:inherit}
.trip .big{font-size:20px;font-weight:800;line-height:1.15}
.trip .cd{margin-left:auto;text-align:right;font-weight:800;color:var(--red);white-space:nowrap}
.day header{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.day header b{font-size:18px}
.day header .btn{margin-left:auto}
.items{list-style:none;margin:0;padding:0}
.it{display:grid;grid-template-columns:52px 14px minmax(0,1fr) auto;gap:10px;align-items:start;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.it:first-child{border-top:0}
.it time{font-weight:800;font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
.it .dot{margin-top:7px}
.it b{display:block;line-height:1.25}
.it small{display:block;font-size:13px}
.it.done b{text-decoration:line-through;text-decoration-thickness:2px;opacity:.6}
.it.night{cursor:default;color:var(--mute)}
.pl{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:10px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.pl .dot{margin-top:7px}
.note{font-size:14px;color:var(--mute);margin-top:2px}
.filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:8px 0}
/* what now */
.now{background:var(--panel);color:var(--ink);border-radius:26px;padding:18px;margin-top:22px;scroll-margin-top:12px}
.now h2{margin:0 0 4px;font-size:26px}
.now .chip{background:var(--bg)}
.now .chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.now select,.now input{background:var(--bg)}
.now label.f{color:var(--mute)}
.fig{position:relative;height:300px;margin:14px 0 4px}
.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.res{background:var(--bg);color:var(--ink);border-radius:20px;padding:10px;margin:10px 0;display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;box-shadow:var(--shadow)}
.res .th{width:72px;height:72px;border-radius:14px;position:relative;background-size:cover;background-position:center;display:grid;place-items:center;color:#fff;font-weight:800;font-size:22px}
.res .th .n{position:absolute;left:5px;top:5px;width:22px;height:22px;font-size:12px;border:2px solid #fff}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.pills span{font-size:12px;font-weight:700;background:var(--panel);border-radius:99px;padding:3px 9px;white-space:nowrap}.pills .y{background:var(--sun);color:var(--teal)}
.res .n{width:28px;height:28px;border-radius:50%;color:#fff;font-weight:800;display:grid;place-items:center;font-size:14px}
.res .act{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.trav{font-weight:700;white-space:nowrap}
/* souvenirs */
.stars{color:var(--red);letter-spacing:1px;white-space:nowrap}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.photos img{width:84px;height:84px;object-fit:cover;border-radius:10px;background:var(--panel2)}
.rate{display:flex;gap:4px;flex-direction:row-reverse;justify-content:flex-end}
.rate input{position:absolute;opacity:0;width:1px;height:1px}
.rate label{font-size:32px;cursor:pointer;color:var(--line);line-height:1;padding:2px}
.rate input:checked~label,.rate label:hover,.rate label:hover~label{color:var(--red)}
.rate input:focus-visible+label{outline:3px solid var(--blue)}
.recap .day{border-left:3px solid var(--red);padding-left:14px;margin:14px 0}
.big3{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:14px 0}
.big3 div{background:var(--panel);border-radius:16px;padding:12px}
.big3 b{display:block;font-size:clamp(22px,6vw,30px);line-height:1}
.big3 span{font-size:13px;color:var(--mute)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(10,10,12,.55);z-index:20;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.md{background:var(--bg);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px 22px}
@media(min-width:700px){.ov{align-items:center}.md{border-radius:22px}}
.md header{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.md header h2{margin:0;flex:1}
.md .foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;position:sticky;bottom:-22px;background:var(--bg);padding:10px 0}
.x{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:22px;line-height:1}
.toast{position:fixed;left:50%;bottom:22px;z-index:40;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
.toast.on{opacity:1}
.ticket{border:2px dashed var(--line);border-radius:16px;padding:16px;text-align:center}
.ticket .ref{font-size:clamp(26px,8vw,40px);font-weight:800;letter-spacing:.06em;overflow-wrap:anywhere}
.files a{display:block;margin:8px 0;font-weight:600}
.files img{max-width:100%;border-radius:12px;margin-top:8px}
.hint{font-size:13px;color:var(--mute);margin-top:6px}
.load{color:var(--mute);font-size:14px}
.acw{position:relative}.acl{position:absolute;left:0;right:0;top:100%;z-index:30;background:var(--bg);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 30px rgba(15,61,62,.18);margin-top:4px;overflow:hidden;max-height:300px;overflow-y:auto}
.aci{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 12px;cursor:pointer;min-height:48px}.aci:hover,.aci:focus{background:var(--panel)}.aci b{display:block;font-size:15px}.aci small{color:var(--mute);font-size:13px}
[hidden]{display:none!important}
body.in-trip .top,body.in-share .top{display:none}body.in-trip .wrap{padding-bottom:120px}
.hero{position:relative;z-index:1;margin:0 -16px;height:300px;overflow:hidden;background:var(--teal);color:#fff}
.hero>img,.hero>svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.28),rgba(0,0,0,0) 38%,rgba(0,0,0,.5));pointer-events:none}
.hero .bar{position:absolute;z-index:2;left:16px;right:16px;top:calc(14px + env(safe-area-inset-top));display:flex;justify-content:space-between;gap:8px;align-items:center}
.hero .ttl{position:absolute;z-index:2;left:20px;right:20px;bottom:44px}
.hero .ttl h1{color:#fff;font-size:clamp(34px,10vw,48px);margin-top:2px}
.hero .ttl div{font-weight:700;font-size:15px;opacity:.95}
.hero.map{height:330px;background:var(--sea)}.hero.map .leaflet-bottom{bottom:28px}.hero.map:after{display:none}.hero.map .lf{position:absolute;inset:0}
.pill{height:36px;padding:0 14px;border-radius:99px;border:0;background:rgba(255,255,255,.95);color:var(--teal);font-weight:800;font-size:13px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap;text-decoration:none;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.pill.dk{background:rgba(15,61,62,.82);color:#fff}.pill.co{background:var(--red);color:#fff}
.pill.lt{background:var(--panel);color:var(--ink);box-shadow:none}
.sheet{position:relative;z-index:3;margin:-26px -16px 0;background:var(--bg);border-radius:26px 26px 0 0;padding:20px 16px 0}
.head{padding:calc(14px + env(safe-area-inset-top)) 0 4px}
.head .bar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.head h1{margin:14px 0 2px}
.wnc{display:flex;align-items:center;gap:12px;background:var(--sun);color:var(--teal);border-radius:22px;padding:14px 16px;text-decoration:none;border:0;width:100%;text-align:left;cursor:pointer}
.wnc .ic{width:46px;height:46px;border-radius:15px;background:var(--teal);display:grid;place-items:center;flex:none}
.wnc b{display:block;font-size:18px}.wnc small{color:var(--teal);font-weight:600;font-size:13px}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:15;max-width:760px;margin:0 auto;background:var(--bg);border-radius:26px 26px 0 0;box-shadow:0 -8px 26px rgba(15,61,62,.12);display:flex;justify-content:space-around;align-items:flex-start;padding:10px 4px calc(8px + env(safe-area-inset-bottom))}
.bnav .tb{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;padding:2px 0;cursor:pointer;color:var(--mute);font-size:11px;font-weight:700;min-width:62px;min-height:48px;border-radius:12px}
.bnav .tb[aria-current=page]{color:var(--ink)}.bnav .tb[aria-current=page]:after{content:"";width:5px;height:5px;border-radius:50%;background:var(--red)}
.bnav .fab{width:60px;height:60px;border-radius:50%;border:4px solid var(--bg);background:var(--red);display:grid;place-items:center;margin-top:-32px;box-shadow:0 8px 20px rgba(255,106,77,.4);cursor:pointer;flex:none}
.acts{display:grid;gap:10px;margin-top:6px}
.act{display:flex;gap:14px;align-items:center;padding:14px;border-radius:20px;background:var(--panel);border:0;text-align:left;cursor:pointer;width:100%}
.act .ic{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;flex:none}
.act b{display:block;font-size:16px}.act small{font-size:13px}
.tcard{display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;border:0;background:var(--bg);box-shadow:var(--shadow);border-radius:22px;padding:10px;margin:12px 0;text-align:left;cursor:pointer}
.tcard .cv{width:84px;height:84px;border-radius:16px;overflow:hidden;background:var(--teal);position:relative}
.tcard .cv img,.tcard .cv svg{width:100%;height:100%;object-fit:cover;display:block}
.tcard .big{font-size:18px;font-weight:800;line-height:1.2}
.tcard .cd{background:var(--sun);color:var(--teal);font-weight:800;font-size:13px;border-radius:99px;padding:4px 10px;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:4px 0 14px}
.stats div{background:var(--panel);border-radius:16px;padding:10px 12px}.stats b{display:block;font-size:20px;line-height:1.2}.stats span{font-size:11px;font-weight:700;color:var(--mute)}
@media(min-width:760px){.hero{border-radius:0 0 28px 28px}}
body.in-trip .toast{bottom:calc(104px + env(safe-area-inset-bottom))}
.mapf{position:relative;height:clamp(260px,52vw,420px);border-radius:24px;overflow:hidden;margin:12px 0;background:var(--sea)}
.mapf>svg,.mapf .lf{position:absolute;inset:0;width:100%;height:100%}.mapf .cap{z-index:500}
.pin{width:26px;height:26px;border-radius:50%;background:var(--teal);color:#fff;border:3px solid #fff;font:800 12px/20px 'Plus Jakarta Sans',sans-serif;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.pin.ph{width:42px;height:42px;background-size:cover;background-position:center}
.leaflet-container{font:inherit;background:var(--sea)}
.mapf .cap{position:absolute;left:12px;bottom:10px;background:var(--bg);color:var(--ink);border-radius:10px;padding:4px 10px;font-size:13px;font-weight:700}
.step{background:var(--bg);border-radius:22px;overflow:hidden;margin:14px 0;box-shadow:var(--shadow)}
.sph{display:grid;gap:4px;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;height:clamp(200px,48vw,320px);position:relative}
.sph img{width:100%;height:100%;object-fit:cover;background:var(--panel2);display:block}
.sph.n1{grid-template-columns:1fr;grid-template-rows:1fr}.sph.n2{grid-template-columns:1fr 1fr;grid-template-rows:1fr}.sph.n3 img:first-child{grid-row:1/3}
.sph .more{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.6);color:#fff;border-radius:8px;padding:2px 8px;font-weight:700}
.sb{padding:12px 16px 14px}.sn{font-size:18px}.stx{margin:8px 0 0;white-space:pre-wrap}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:#fff;background:var(--red);border-radius:99px;padding:3px 10px;white-space:nowrap}
.live:before{content:"";width:7px;height:7px;border-radius:50%;background:#fff}
@media(max-width:600px){.g2:not(.keep){grid-template-columns:minmax(0,1fr)}.filters{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.filters .q{grid-column:1/-1}.big3{grid-template-columns:repeat(2,minmax(0,1fr))}.it{grid-template-columns:46px 12px minmax(0,1fr)}.it .side{grid-column:3}}
@media(prefers-reduced-motion:no-preference){.pulse{animation:p 2.4s ease-out infinite;transform-origin:center;transform-box:fill-box}@keyframes p{0%{transform:scale(1);opacity:.55}100%{transform:scale(3.2);opacity:0}}}
</style>
</head>
<body>
<div class="top"><button class="logo" data-a="home" aria-label="Accueil Escale"><i></i>Escale</button><span class="sp"></span><span class="sync" id="sync"></span><button class="btn s g" data-a="settings">Réglages</button></div>
<main class="wrap" id="app"><p class="load">Chargement de tes voyages…</p></main>
<div class="ov" id="ov" role="dialog" aria-modal="true"><div class="md" id="md"></div></div>
<div class="toast" id="toast" role="status"></div>
<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const todayISO=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};
const nowHM=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const diffDays=(a,b)=>Math.round((new Date(b+'T00:00:00Z')-new Date(a+'T00:00:00Z'))/864e5);
const fmtD=(s,o)=>s?new Date(s+'T00:00:00Z').toLocaleDateString('fr-FR',Object.assign({weekday:'short',day:'numeric',month:'short'},o||{},{timeZone:'UTC'})):'';
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
const days=t=>{const a=[];if(!t.start||!t.end)return a;let d=t.start;while(d<=t.end&&a.length<120){a.push(d);d=addDays(d,1)}return a};
const fmtMin=m=>m<60?Math.round(m)+' min':Math.floor(m/60)+' h'+(Math.round(m%60)?' '+String(Math.round(m%60)).padStart(2,'0'):'');
const CATS={resto:{l:'Resto',c:'#e2401f',d:60},bar:{l:'Bar',c:'#b0399b',d:60},boutique:{l:'Boutique',c:'#d08f00',d:30},visite:{l:'Visite',c:'#1d55cf',d:90},activite:{l:'Activité',c:'#13916a',d:120},autre:{l:'Autre',c:'#7a7a82',d:45}};
const BT={vol:'Vol',train:'Train',bus:'Bus',bateau:'Bateau',hotel:'Hébergement',resto:'Restaurant',bar:'Bar / sortie',visite:'Visite / musée',spectacle:'Spectacle / concert',activite:'Activité',location:'Location (voiture, scooter…)',autre:'Autre'};
const bLabel=b=>b.type==='autre'&&b.custom?b.custom:(BT[b.type]||'Autre').replace(/ \(.*\)$/,'');
const WANT=[['all','Tout'],['resto','Manger'],['bar','Boire un verre'],['visite','Visiter'],['activite','Activité'],['boutique','Shopping']];
const MINS=[[30,'30 min'],[60,'1 h'],[120,'2 h'],[180,'3 h'],[360,'Demi-journée']];
const LS='escale.trips.v1';

const S={deleted:{},follow:[],view:'home',tripId:null,tab:'prep',sub:'prog',f:{cat:'all',st:'all',city:'all',q:''},now:{day:null,at:'',mins:120,want:'all',custom:''},sug:null,sample:null,recap:null};
const W={};

/* ---------- stockage : sur l'appareil + serveur (sans compte) ---------- */
const LSD='escale.deleted.v1',MEK='escale.me',FOL='escale.follow';
const rnd=n=>{const a=new Uint8Array(n);crypto.getRandomValues(a);return[...a].map(x=>'abcdefghijklmnopqrstuvwxyz0123456789'[x%36]).join('')};
const lsGet=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||'null')||d}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const lsLoad=()=>lsGet(LS,{});
const lsSave=()=>{lsSet(LS,S.trips);lsSet(LSD,S.deleted)};
let ME=lsGet(MEK,null);if(!ME||!ME.id){ME={id:rnd(12),secret:rnd(28)};lsSet(MEK,ME)}
async function api(path,body){const r=await fetch(path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j.error||('Erreur '+r.status));e.status=r.status;throw e}return j}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2800)}
const SY={tm:null,busy:false,again:false};
function syncLabel(m){const e=$('#sync');if(e)e.textContent=m}
function save(t){t.updated=Date.now();S.trips[t.id]=t;lsSave();pushLive(t);schedulePush()}
function schedulePush(){clearTimeout(SY.tm);syncLabel('Enregistrement…');SY.tm=setTimeout(pushNow,1500)}
async function pushNow(){if(SY.busy){SY.again=true;return}SY.busy=true;SY.again=false;
 try{await api('/api/me',{op:'put',id:ME.id,secret:ME.secret,doc:{trips:S.trips,deleted:S.deleted}});syncLabel('Sauvegardé')}
 catch(e){syncLabel(navigator.onLine===false?'Hors ligne · enregistré ici':'Enregistré sur ce téléphone');SY.retry=true}
 SY.busy=false;if(SY.again)pushNow()}
function merge(doc){let changed=false,need=false;const st=doc.trips||{},dl=doc.deleted||{};
 Object.entries(dl).forEach(([id,ts])=>{if(!S.deleted[id]||S.deleted[id]<ts){S.deleted[id]=ts}if(S.trips[id]&&(S.trips[id].updated||0)<ts){delete S.trips[id];changed=true}});
 Object.values(st).forEach(t=>{if(!t||!t.id||S.deleted[t.id]>=(t.updated||0))return;const l=S.trips[t.id];if(!l||(t.updated||0)>(l.updated||0)){S.trips[t.id]=t;changed=true}else if((l.updated||0)>(t.updated||0))need=true});
 Object.keys(S.trips).forEach(id=>{if(!st[id])need=true});Object.keys(S.deleted).forEach(id=>{if(!dl[id])need=true});
 if(changed)lsSave();return{changed,need}}
async function pull(){try{const r=await api('/api/me',{op:'get',id:ME.id,secret:ME.secret});const m=merge(r.doc);syncLabel('Sauvegardé');if(m.need)schedulePush();
  if(m.changed&&!$('#ov').classList.contains('on')&&!(document.activeElement&&document.activeElement.matches('input,textarea,select')))render()}
 catch(e){if(e.status===404){if(Object.keys(S.trips).length)schedulePush();else syncLabel('')}else syncLabel(navigator.onLine===false?'Hors ligne':'')}}
function removeTrip(id){delete S.trips[id];S.deleted[id]=Date.now();lsSave();schedulePush()}
async function uploadFile(f){const meta=await photoMeta(f),b=await shrink(f);let type=(b.type||f.type||'').toLowerCase();if(!type&&/\.pdf$/i.test(f.name))type='application/pdf';if(!type&&/\.(heic|heif)$/i.test(f.name))type='image/heic';
 const r=await fetch('/api/upload',{method:'POST',headers:{'Content-Type':type||'application/octet-stream','x-escale-id':ME.id},body:b});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Envoi impossible');
 return Object.assign({url:j.url,name:f.name,type},meta)}
const fileUrl=f=>!f?'':typeof f==='string'?f:f.url||'';
function gps(){return new Promise((res,rej)=>{if(!navigator.geolocation){rej(new Error('GPS indisponible sur cet appareil'));return}navigator.geolocation.getCurrentPosition(p=>res({lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),acc:p.coords.accuracy,t:Date.now()}),e=>rej(new Error(e.code===1?'Localisation refusée : autorise-la dans les réglages du navigateur.':'Position introuvable pour le moment.')),{enableHighAccuracy:true,timeout:15000,maximumAge:60000})})}
async function gpsGranted(){try{const p=await navigator.permissions.query({name:'geolocation'});return p.state==='granted'}catch(e){return false}}
const T=()=>S.trips[S.tripId];

/* ---------- géo ---------- */
function parseGeo(s){if(!s)return null;s=String(s);let m=s.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)||s.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/)||s.match(/[?&](?:q|query|ll|destination)=(-?\d+\.\d+)(?:,|%2C)\s*(-?\d+\.\d+)/)||s.match(/^\s*(-?\d{1,2}\.\d+)\s*[,; ]\s*(-?\d{1,3}\.\d+)\s*$/);
 if(!m)return null;const lat=+m[1],lng=+m[2];return Math.abs(lat)<=90&&Math.abs(lng)<=180?{lat,lng}:null}
const hasG=p=>p&&typeof p.lat==='number'&&typeof p.lng==='number';
function km(a,b){const r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lng-a.lng)*r;const h=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)**2;return 12742*Math.asin(Math.sqrt(h))}
function travel(k){const walk=k*1.3/4.5*60;if(walk<=25)return{min:Math.max(2,walk),how:'à pied'};return{min:8+k*1.3/18*60,how:'en taxi / Grab'}}
const FR={'Thailand':'Thaïlande','Cambodia':'Cambodge','Vietnam':'Viêt Nam','Spain':'Espagne','Italy':'Italie','Japan':'Japon','Indonesia':'Indonésie','Malaysia':'Malaisie','Myanmar':'Birmanie','Greece':'Grèce','Morocco':'Maroc','United States of America':'États-Unis','United Kingdom':'Royaume-Uni','Germany':'Allemagne','Mexico':'Mexique','Peru':'Pérou','Brazil':'Brésil','Netherlands':'Pays-Bas','Croatia':'Croatie','Turkey':'Turquie','India':'Inde','China':'Chine','South Korea':'Corée du Sud','Belgium':'Belgique','Switzerland':'Suisse','Ireland':'Irlande','Norway':'Norvège','Iceland':'Islande','Egypt':'Égypte','Tunisia':'Tunisie','Australia':'Australie','New Zealand':'Nouvelle-Zélande','Argentina':'Argentine','Chile':'Chili','Colombia':'Colombie','Austria':'Autriche','Czechia':'Tchéquie','Poland':'Pologne','Hungary':'Hongrie','Denmark':'Danemark','Sweden':'Suède','Singapore':'Singapour','Nepal':'Népal','United Arab Emirates':'Émirats arabes unis','South Africa':'Afrique du Sud','Tanzania':'Tanzanie','Algeria':'Algérie','Senegal':'Sénégal','Jordan':'Jordanie','Lebanon':'Liban','Albania':'Albanie','Montenegro':'Monténégro','Slovenia':'Slovénie','Romania':'Roumanie','Bulgaria':'Bulgarie','Georgia':'Géorgie','Cyprus':'Chypre','Malta':'Malte','Scotland':'Écosse','Philippines':'Philippines'};
const lib=src=>new Promise((res,rej)=>{if(document.querySelector('script[src="'+src+'"]')){res();return}const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)});
let GEO=null;const geoLoad=()=>GEO||(GEO=(async()=>{await lib('https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js');await lib('https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js');const w=await(await fetch('/countries-50m.json')).json();return topojson.feature(w,w.objects.countries).features})().catch(()=>null));
let EXIF=null;const exifLoad=()=>EXIF||(EXIF=lib('https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js').then(()=>window.exifr||null).catch(()=>null));
const pathKm=pts=>pts.reduce((a,p,i)=>i?a+km(pts[i-1],p):0,0);
const pad2=n=>String(n).padStart(2,'0');
async function photoMeta(f){if(!(f.type||'').startsWith('image')&&!/\.(jpe?g|heic|heif|png)$/i.test(f.name||''))return{};const ex=await exifLoad();if(!ex)return{};
 try{const d=await ex.parse(f);const o={};if(d&&typeof d.latitude==='number'&&typeof d.longitude==='number'&&(d.latitude||d.longitude)){o.lat=+d.latitude.toFixed(6);o.lng=+d.longitude.toFixed(6)}
  const t=d&&(d.DateTimeOriginal||d.CreateDate);if(t instanceof Date&&!isNaN(t))o.taken=t.getFullYear()+'-'+pad2(t.getMonth()+1)+'-'+pad2(t.getDate())+'T'+pad2(t.getHours())+':'+pad2(t.getMinutes());return o}catch(e){return{}}}
async function shrink(f){if(!/^image\/(jpeg|png|webp)/.test(f.type||'')||f.size<600000)return f;try{const b=await createImageBitmap(f);const k=Math.min(1,1800/Math.max(b.width,b.height));const c=document.createElement('canvas');c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);c.getContext('2d').drawImage(b,0,0,c.width,c.height);const o=await new Promise(r=>c.toBlob(r,'image/jpeg',.85));return o&&o.size<f.size?o:f}catch(e){return f}}
const mapsUrl=p=>'https://www.google.com/maps/dir/?api=1&destination='+(hasG(p)?p.lat+','+p.lng:encodeURIComponent(p.address||((p.name||p.title||'')+' '+(p.city||''))).trim());

/* ---------- logique voyage ---------- */
function phase(t){const d=todayISO();if(!t.start)return'avant';if(d<t.start)return'avant';if(d<=t.end)return'pendant';return'apres'}
function phaseLabel(t){const p=phase(t),d=todayISO();if(p==='avant'){const n=diffDays(d,t.start);return['Avant le départ','J-'+n]}if(p==='pendant')return['Sur place','Jour '+(diffDays(t.start,d)+1)+'/'+days(t).length];return['De retour','Souvenirs']}
function hotelNight(t,d){return(t.bookings||[]).find(b=>b.type==='hotel'&&b.date&&b.date<=d&&(b.endDate||b.date)>d)}
function cityOf(t,d){return(t.dayCity||{})[d]||(hotelNight(t,d)||{}).city||''}
function route(t){const out=[];days(t).forEach(d=>{const c=cityOf(t,d);c.split(/\s*(?:→|->)\s*/).forEach(x=>{x=x.trim();if(x&&out[out.length-1]!==x)out.push(x)})});return out.slice(0,7)}
function dayItems(t,d){const it=[];
 (t.bookings||[]).forEach(b=>{if(b.date===d)it.push({k:'b',o:b,time:b.time||'',title:bTitle(b),sub:bLabel(b)+(b.ref?' · réf. '+b.ref:''),color:'var(--ink)'});
  if(b.type==='hotel'&&b.endDate===d&&b.endDate!==b.date)it.push({k:'b',o:b,time:b.endTime||'',title:'Check-out · '+b.title,sub:'Hébergement',color:'var(--ink)'})});
 (t.places||[]).forEach(p=>{if(p.date===d)it.push({k:'p',o:p,time:p.time||'',title:p.name,sub:CATS[p.cat].l+(p.area?' · '+p.area:'')+(p.status==='reserve'?' · réservé':''),color:CATS[p.cat].c})});
 it.sort((a,b)=>(a.time||'99')<(b.time||'99')?-1:(a.time||'99')>(b.time||'99')?1:0);return it}
function bTitle(b){if(['vol','train','bus','bateau'].includes(b.type)&&(b.from||b.to))return BT[b.type]+' '+(b.from||'?')+' → '+(b.to||'?');return b.title||bLabel(b)}
const stepsSorted=t=>(t.steps||[]).slice().sort((a,b)=>((a.date||'')+(a.time||''))<((b.date||'')+(b.time||''))?-1:1);
function mapPoints(t){const st=stepsSorted(t).filter(hasG);if(st.length)return{pts:st.map(s=>({lat:s.lat,lng:s.lng,photo:(s.photos||[])[0]||null,label:s.name,sid:s.id})),planned:false};
 const pts=[];days(t).forEach(d=>{const h=hotelNight(t,d);const o=h&&hasG(h)?h:dayItems(t,d).map(x=>x.o).filter(hasG)[0];if(o){const l=pts[pts.length-1];if(!l||km(l,o)>2)pts.push({lat:o.lat,lng:o.lng,label:cityOf(t,d)||o.title||o.name})}});return{pts,planned:true}}
function stepsHTML(st,own){let prev=null;return st.map((s,i)=>{const k=prev&&hasG(s)?km(prev,s):null;if(hasG(s))prev=s;const ph=s.photos||[];
 return`<article class="step" id="st-${esc(s.id||'r'+i)}">${ph.length?`<div class="sph n${Math.min(ph.length,3)}">${ph.slice(0,3).map(f=>`<img src="${esc(fileUrl(f))}" alt="" loading="lazy">`).join('')}${ph.length>3?`<span class="more">+${ph.length-3}</span>`:''}</div>`:''}
 <div class="sb"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><div><b class="sn">${esc(s.name||'Étape')}</b><div class="note">${s.date?cap(fmtD(s.date,{month:'long'})):''}${s.time?' · '+esc(s.time):''}${k!=null&&k>=1?' · '+Math.round(k)+' km depuis l’étape précédente':''}</div></div>${own?`<button class="btn s g" data-a="editStep" data-v="${s.id}">Modifier</button>`:''}</div>${s.text?`<p class="stx">${esc(s.text)}</p>`:''}</div></article>`}).join('')}
function liveBar(t){return t.live&&t.shareCode?`<div class="card row"><span class="live">En direct</span><span style="flex:1">Tes amis suivent ce voyage avec le code <b>${esc(t.shareCode)}</b>.</span><button class="btn s g" data-a="share">Réglages</button></div>`
 :`<div class="card row"><span style="flex:1">Fais suivre ton voyage à tes proches, étape par étape.</span><button class="btn s p" data-a="share">Partager en direct</button></div>`}
function journalHTML(t,inHero){const st=stepsSorted(t),mp=mapPoints(t);S.mapData=mp;const loc=st.filter(hasG),photos=st.reduce((a,s)=>a+(s.photos||[]).length,0);
 return`${inHero&&mp.pts.length?'':mapBox(mp)}
 <div class="big3"><div><b>${Math.round(pathKm(loc.length?loc:mp.pts)).toLocaleString('fr-FR')}</b><span>km ${loc.length?'parcourus':'prévus'}</span></div><div><b id="ncountries">—</b><span>pays</span></div><div><b>${st.length}</b><span>étapes</span></div><div><b>${photos}</b><span>photos</span></div></div><p class="hint" id="cnames"></p>${liveBar(t)}
 <div class="row" style="justify-content:space-between;margin-top:14px"><h2 style="margin:0">Étapes</h2><button class="btn r s" data-a="addStep">+ Étape</button></div>
 ${st.length?stepsHTML(st.slice().reverse(),true):'<div class="empty">Ton carnet est vide. Sur place, publie une étape avec une photo et quelques mots : elle se place sur la carte, dans ton récap et chez tes amis si tu partages en direct.</div>'}`}
function mapBox(mp){return mp.pts.length?`<div class="mapf" id="map"><div class="lf" role="img" aria-label="Carte du voyage"></div><span class="cap">${mp.planned?'Itinéraire prévu':'Ton parcours'}</span></div>`:'<p class="hint">Ajoute des positions (adresses, hôtels ou étapes) pour voir la carte.</p>'}
let LF=null;const leaflet=()=>LF||(LF=(async()=>{const l=document.createElement('link');l.rel='stylesheet';l.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';document.head.appendChild(l);await lib('https://unpkg.com/leaflet@1.9.4/dist/leaflet.js');return window.L||null})().catch(()=>null));
function countCountries(pts){geoLoad().then(feats=>{if(!feats||!window.d3)return;const at=p=>{for(const r of [0,.06,.15,.3]){for(const[a,b]of r?[[r,0],[-r,0],[0,r],[0,-r],[r,r],[-r,-r],[r,-r],[-r,r]]:[[0,0]]){const f=feats.find(f=>d3.geoContains(f,[p.lng+a,p.lat+b]));if(f)return f}}return null};
 const vis=[...new Set(pts.map(at).filter(Boolean))];if(!vis.length)return;const nc=document.getElementById('ncountries'),cn=document.getElementById('cnames'),nl=document.getElementById('nclab');if(nc)nc.textContent=vis.length;if(nl)nl.textContent='pays';if(cn)cn.textContent=vis.map(f=>FR[f.properties.name]||f.properties.name).join(' · ')})}
async function drawMap(el,data){if(!data||!data.pts.length)return;countCountries(data.pts);const L=await leaflet();if(!el.isConnected)return;const box=el.querySelector('.lf');if(!L||!box){el.insertAdjacentHTML('beforeend','<span class="cap" style="left:auto;right:12px">Carte indisponible hors connexion</span>');return}
 const inHero=el.classList.contains('hero');const m=L.map(box,{scrollWheelZoom:false,attributionControl:true,zoomSnap:.25,zoomControl:!inHero});L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{attribution:'© OpenStreetMap © CARTO',subdomains:'abcd',maxZoom:19}).addTo(m);
 const pts=data.pts,ll=pts.map(p=>[p.lat,p.lng]),red=getComputedStyle(document.documentElement).getPropertyValue('--red').trim()||'#e2401f';
 for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];if(km(a,b)>300){const dx=b.lng-a.lng,dy=b.lat-a.lat,o=.18,c=[(a.lat+b.lat)/2+dx*o,(a.lng+b.lng)/2-dy*o],arc=[];for(let k=0;k<=24;k++){const t=k/24,u=1-t;arc.push([u*u*a.lat+2*u*t*c[0]+t*t*b.lat,u*u*a.lng+2*u*t*c[1]+t*t*b.lng])}L.polyline(arc,{color:red,weight:2.5,dashArray:'1 8',lineCap:'round'}).addTo(m)}
  else L.polyline([[a.lat,a.lng],[b.lat,b.lng]],{color:red,weight:3.5,opacity:.9,dashArray:data.planned?'7 7':null}).addTo(m)}
 pts.forEach((p,i)=>{const ph=p.photo&&fileUrl(p.photo);const ic=L.divIcon({className:'',html:ph?`<div class="pin ph" style="background-image:url('${esc(ph)}')"></div>`:`<div class="pin">${i+1}</div>`,iconSize:ph?[42,42]:[26,26],iconAnchor:ph?[21,21]:[13,13]});
  const mk=L.marker([p.lat,p.lng],{icon:ic,zIndexOffset:i}).addTo(m);if(p.label)mk.bindPopup(esc(p.label));mk.on('click',()=>{const c=document.getElementById('st-'+p.sid);if(c)c.scrollIntoView({behavior:'smooth',block:'center'})})});
 if(ll.length===1)m.setView(ll[0],13);else m.fitBounds(ll,inHero?{paddingTopLeft:[36,76],paddingBottomRight:[36,56],maxZoom:14}:{padding:[36,36],maxZoom:14});el._map=m}
function itemHTML(t,x,opts){const o=x.o,done=x.k==='p'&&o.visited;
 return`<li class="it${done?' done':''}" data-a="${x.k==='p'?'editPlace':'ticket'}" data-v="${o.id}" tabindex="0"><time>${esc(x.time||'—')}</time><span class="dot" style="color:${x.color}"></span><div><b>${esc(x.title)}</b><small>${esc(x.sub)}</small>${x.k==='p'&&o.note&&opts&&opts.notes?`<div class="note">${esc(o.note)}</div>`:''}</div>${x.k==='b'&&(o.files||[]).length?'<span class="tag side">Billet</span>':x.k==='p'&&o.must?'<span class="tag must side">Incontournable</span>':'<span></span>'}</li>`}

/* ---------- recherche d'adresses (OpenStreetMap) ---------- */
function tripCenter(t,city){const all=[...(t.bookings||[]),...(t.places||[]),...(t.steps||[])].filter(hasG);const c=String(city||'').trim().toLowerCase();
 const m=c?all.find(x=>(x.city||'').toLowerCase()===c||(x.address||'').toLowerCase().includes(c)):null;return m||all.find(x=>x.type==='hotel')||all[0]||null}
async function geoSearch(q,center){const u='/api/geo?q='+encodeURIComponent(q)+(center?'&lat='+center.lat.toFixed(2)+'&lon='+center.lng.toFixed(2):'');const r=await fetch(u);if(!r.ok)return[];const j=await r.json().catch(()=>({}));return j.items||[]}
const AC={tm:null,items:[],el:null};
function acClose(){const l=$('#acl');if(l)l.remove();AC.items=[]}
function acRun(inp){clearTimeout(AC.tm);const q=inp.value.trim();if(q.length<3){acClose();return}
 AC.tm=setTimeout(async()=>{const t=T();const f=inp.form,city=f&&f.elements.namedItem('city')?f.elements.namedItem('city').value:'';
  const extra=inp.dataset.ac==='name'&&city&&!q.toLowerCase().includes(city.toLowerCase())?' '+city:'';
  let items=[];try{items=await geoSearch(q+extra,t&&tripCenter(t,city))}catch(e){}if(inp.value.trim()!==q)return;
  acClose();if(!items.length)return;AC.items=items;AC.el=inp;
  const box=document.createElement('div');box.id='acl';box.className='acl';box.setAttribute('role','listbox');
  box.innerHTML=items.map((x,i)=>`<button type="button" class="aci" data-a="acPick" data-v="${i}" role="option"><b>${esc(x.name)}</b><small>${esc(x.label||x.address)}</small></button>`).join('')+'<div class="hint" style="padding:6px 12px">Résultats OpenStreetMap</div>';
  inp.closest('.acw').appendChild(box)},350)}
function acPick(i){const x=AC.items[+i],inp=AC.el;if(!x||!inp)return;const f=inp.form.elements,set=(n,v,force)=>{const e=f.namedItem(n);if(e&&v&&(force||!e.value.trim()))e.value=v};
 if(inp.dataset.ac==='name'){set('name',x.name,true);set('address',x.address,true)}else{set('address',x.address||x.name,true);set('title',x.kind&&x.kind!=='house'&&x.kind!=='residential'?x.name:'')}
 set('city',x.city);set('area',x.area);set('geo',x.lat.toFixed(5)+', '+x.lng.toFixed(5),true);const h=inp.form.querySelector('.geoh');if(h)h.textContent='Position trouvée : '+(x.label||x.address||x.name)+'.';acClose()}
async function geoAuto(t,o){if(hasG(o))return;const q=(o.address||'').trim()||[o.name||o.title,o.city].filter(Boolean).join(' ').trim();if(q.length<3)return;
 try{const c=tripCenter(t,o.city);const it=(await geoSearch(q,c))[0];if(!it)return;if(c&&km(c,it)>150)return;o.lat=it.lat;o.lng=it.lng;o.geoApprox=true;if(!o.city&&it.city)o.city=it.city;save(t);if(S.view==='trip'&&!$('#ov').classList.contains('on'))render()}catch(e){}}

function spots(t,d){const out=[],seen=new Set();const push=(k,o,label)=>{if(!hasG(o)||seen.has(k+o.id))return;seen.add(k+o.id);out.push({v:k+':'+o.id,label,lat:o.lat,lng:o.lng})};
 stepsSorted(t).filter(s=>s.date===d).reverse().forEach(s=>push('s',s,'Étape · '+(s.time?s.time+' · ':'')+s.name));dayItems(t,d).forEach(x=>push(x.k,x.o,(x.time?x.time+' · ':'')+x.title));const h=hotelNight(t,d)||hotelNight(t,addDays(d,-1));if(h)push('b',h,'Hôtel · '+h.title);
 const c=cityOf(t,d).toLowerCase();(t.places||[]).filter(p=>p.city&&c.includes(p.city.toLowerCase())).forEach(p=>push('p',p,p.name));
 (t.places||[]).forEach(p=>push('p',p,p.name+(p.city?' ('+p.city+')':'')));return out}
function herePos(t,d){if(S.now.at==='gps')return S.now.gps||null;if(S.now.at==='custom')return parseGeo(S.now.custom);if(!S.now.at&&S.now.gps&&Date.now()-S.now.gps.t<20*60000){S.now.at='gps';return S.now.gps}const sp=spots(t,d);let s=sp.find(x=>x.v===S.now.at);
 if(!s){const st=stepsSorted(t).filter(x=>x.date===d&&hasG(x));if(st.length)s=sp.find(x=>x.v==='s:'+st[st.length-1].id)}if(!s){const done=(t.places||[]).filter(p=>p.visited&&p.visitedOn===d&&hasG(p));s=done.length?sp.find(x=>x.v==='p:'+done[done.length-1].id):sp[0];if(s)S.now.at=s.v}return s?{lat:s.lat,lng:s.lng}:null}
function nextUp(t,d){if(d!==todayISO())return null;const n=nowHM();return dayItems(t,d).find(x=>x.time&&x.time>n&&!(x.k==='p'&&x.o.visited))||null}
function candidates(t,d,here){const c=cityOf(t,d).toLowerCase(),want=S.now.want;
 return(t.places||[]).filter(p=>!p.visited&&(!p.date||p.date===d)&&(want==='all'||p.cat===want)).map(p=>{const dur=+p.dur||CATS[p.cat].d;
  if(here&&hasG(p)){const k=km(here,p);if(k>25)return null;const tr=travel(k);return{p,k,tr,dur,need:tr.min+dur}}
  if(p.city&&c.includes(p.city.toLowerCase()))return{p,k:null,tr:null,dur,need:dur};return null}).filter(Boolean)
  .filter(x=>x.need<=S.now.mins+5).sort((a,b)=>(b.p.must?1:0)-(a.p.must?1:0)||(a.k??99)-(b.k??99)).slice(0,8)}
function renderNow(t){const ds=days(t),td=todayISO();if(!ds.length)return'<div class="empty">Ajoute des dates au voyage.</div>';
 if(!S.now.day||!ds.includes(S.now.day))S.now.day=ds.includes(td)?td:ds[0];const d=S.now.day;
 const it=dayItems(t,d),tickets=(t.bookings||[]).filter(b=>b.date===d||(b.type==='hotel'&&b.date<=d&&(b.endDate||b.date)>=d));
 const here=herePos(t,d),nu=nextUp(t,d);
 if(nu&&!S.now.touched){const m=(+nu.time.slice(0,2)*60+ +nu.time.slice(3))-(new Date().getHours()*60+new Date().getMinutes());S.now.mins=MINS.reduce((a,b)=>Math.abs(b[0]-m)<Math.abs(a[0]-m)?b:a)[0]}
 const res=candidates(t,d,here);S.res=res;
 const sp=spots(t,d),di=ds.indexOf(d)+1,city=(cityOf(t,d)||t.dest||'').split(/→/).pop().trim();
 const mins=nu?((+nu.time.slice(0,2)*60+ +nu.time.slice(3))-(new Date().getHours()*60+new Date().getMinutes())):null;
 return`<section class="hero">${coverHTML(t,d)}<div class="bar">${tripPill(t,true)}<span class="pill dk">Jour ${di} sur ${ds.length}</span></div>
 <div class="ttl"><div>${cap(fmtD(d,{month:'long'}))}</div><h1>${esc(city||'Aujourd’hui')}</h1></div></section>
 <div class="sheet">
 <button class="wnc" data-a="toWn"><span class="ic">${ic('spark','#ffc43d',22,2.2)}</span><span style="flex:1"><b>What now&#8239;?</b><small>${mins&&mins>0?fmtMin(mins)+' avant '+esc(nu.title)+' · ':''}${res.length} adresse${res.length>1?'s':''} à toi autour</small></span>${ic('chev','#0f3d3e',22,2.6)}</button>
 ${ds.includes(td)?'':`<p class="hint">Le voyage n’a pas commencé ou est terminé : aperçu du ${fmtD(d)}.</p>`}
 <div class="scroll" role="tablist" aria-label="Jour" style="margin-top:14px">${ds.map((x,i)=>`<button class="chip" aria-pressed="${x===d}" data-a="nowDay" data-v="${x}">${x===td?'Aujourd’hui':'J'+(i+1)+' · '+fmtD(x,{weekday:undefined,month:'short'})}</button>`).join('')}</div>
 <div class="card day"><header><b>${cap(fmtD(d,{month:'long'}))}</b><small>${esc(cityOf(t,d))}</small><button class="btn s g" data-a="addToDay" data-v="${d}">+ Plan</button></header>
 <ol class="items">${it.map(x=>itemHTML(t,x,{notes:true})).join('')||'<li class="it night"><time></time><span></span><small>Rien de prévu : demande à « What now ? »</small></li>'}</ol>
 ${(t.dayNote||{})[d]?`<p class="note">${esc(t.dayNote[d])}</p>`:''}</div>
 <div class="row" style="margin:14px 0"><button class="btn r" data-a="addStep">Publier une étape</button><span class="hint" style="margin:0;flex:1;min-width:200px">Photos, lieu, récit : ça trace ta carte${t.live?' et tes amis le voient en direct':''}.</span></div>
 ${(()=>{const st=stepsSorted(t).filter(s=>s.date===d);return st.length?'<h2>Étapes du jour</h2>'+stepsHTML(st,true):''})()}
 ${tickets.length?`<h2>Billets & réservations du jour</h2><div class="scroll">${tickets.map(b=>`<button class="btn g" data-a="ticket" data-v="${b.id}">${esc(bTitle(b))}${b.ref?' · '+esc(b.ref):''}</button>`).join('')}</div>`:''}
 <section class="now" id="wnsec" aria-labelledby="wn"><h2 id="wn">What now&#8239;?</h2><div class="mute" style="font-size:15px">${nu?`Prochain rendez-vous : <b>${esc(nu.title)}</b> à ${esc(nu.time)}.`:'Un trou dans la journée ? Voici tes adresses enregistrées qui tiennent dans ce temps.'}</div>
 <div class="g2"><div><label class="f" for="at">Je suis à</label><select id="at" data-c="nowAt"><option value="gps"${S.now.at==='gps'?' selected':''}>${S.now.gps?'Ma position GPS':'Ma position GPS (me localiser)'}</option>${sp.map(s=>`<option value="${esc(s.v)}"${s.v===S.now.at?' selected':''}>${esc(s.label)}</option>`).join('')}<option value="custom"${S.now.at==='custom'?' selected':''}>Autre position (lien Maps ou coordonnées)…</option></select></div>
 <div>${S.now.at==='custom'||!sp.length?`<label class="f" for="cu">Lien Google Maps ou « lat, lng »</label><input id="cu" data-c="nowCustom" value="${esc(S.now.custom)}" placeholder="13.7465, 100.4927">`:`<label class="f">&nbsp;</label><button class="btn p" data-a="locate" style="width:100%">${S.now.locating?'Localisation…':'Me localiser'}</button>`}</div></div>
 <label class="f">J’ai</label><div class="row">${MINS.map(([m,l])=>`<button class="chip" aria-pressed="${S.now.mins===m}" data-a="mins" data-v="${m}">${l}</button>`).join('')}</div>
 <label class="f">Envie de</label><div class="row">${WANT.map(([k,l])=>`<button class="chip" aria-pressed="${S.now.want===k}" data-a="want" data-v="${k}">${l}</button>`).join('')}</div>
 ${here?'<div class="fig" id="radar" aria-label="Radar des adresses autour de toi"><svg></svg></div>':'<p class="hint">Touche « Me localiser » ou choisis où tu es pour voir les distances.</p>'}
 ${res.length?res.map((x,i)=>{const ph=(x.p.photos||[])[0];return`<div class="res"><span class="th" style="background-color:${CATS[x.p.cat].c};${ph?`background-image:url('${esc(fileUrl(ph))}')`:''}">${ph?'':esc(x.p.name.slice(0,1))}<span class="n" style="background:var(--teal)">${i+1}</span></span><div><b>${esc(x.p.name)}</b><div class="note">${CATS[x.p.cat].l}${x.p.area?' · '+esc(x.p.area):''}</div>
 <div class="pills"><span>${x.tr?(x.tr.how==='à pied'?'À pied ':'Taxi ')+fmtMin(x.tr.min):'distance inconnue'}</span><span>~${fmtMin(x.dur)} sur place</span>${x.p.must?'<span class="y">Incontournable</span>':''}</div>${x.p.note?`<div class="note">${esc(x.p.note)}</div>`:''}
 <div class="act" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;padding:0;background:none"><button class="btn s p" data-a="go" data-v="${x.p.id}">J’y vais</button><a class="btn s g" href="${mapsUrl(x.p)}" target="_blank" rel="noopener">Itinéraire</a><button class="btn s g" data-a="done" data-v="${x.p.id}">Déjà fait</button></div></div></div>`}).join('')
 :`<p style="margin:16px 0 6px">Aucune adresse enregistrée ne tient dans ${fmtMin(S.now.mins)} ici.</p>`}
 ${S.sample&&here?`<div style="margin-top:14px"><button class="btn r" data-a="more">${S.now.want==='resto'?'Plus de restos autour de moi':'Plus d’idées autour de moi'}</button><div class="hint">Suggestions de l’IA, en plus de tes adresses. Vérifie horaires et avis avant d’y aller.</div></div>`:''}
 ${S.sug?renderSug():''}</section></div>`}
function renderSug(){if(S.sug==='load')return'<p style="margin-top:12px">Recherche d’idées à proximité…</p>';if(!S.sug.length)return'<p style="margin-top:12px">Pas de suggestion trouvée.</p>';
 return'<h3 style="margin:16px 0 4px">Autres idées à proximité</h3>'+S.sug.map((s,i)=>`<div class="res"><span class="th" style="background:var(--panel2);color:var(--ink)">+</span><div><b>${esc(s.name)}</b><div class="note">${esc((CATS[s.cat]||CATS.autre).l)}${s.area?' · '+esc(s.area):''}${s.trav?' · '+esc(s.trav):''}</div>${s.why?`<div class="note">${esc(s.why)}</div>`:''}<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px"><button class="btn s p" data-a="addSug" data-v="${i}">Ajouter à mes adresses</button><a class="btn s g" href="${mapsUrl(s)}" target="_blank" rel="noopener">Voir sur Maps</a></div></div></div>`).join('')}

/* ---------- radar ---------- */
let RO=null;
function afterRender(){const f=$('#radar'),m=$('#map');if(RO){RO.disconnect();RO=null}if(m)drawMap(m,S.mapData);if(!f)return;RO=new ResizeObserver(()=>drawRadar(f));RO.observe(f)}
function drawRadar(f){const s=f.querySelector('svg'),W=f.clientWidth,H=f.clientHeight;if(!W)return;const t=T(),here=herePos(t,S.now.day);if(!here){s.innerHTML='';return}
 const res=(S.res||[]).filter(x=>x.k!=null),R=Math.min(W,H)/2-26,cx=W/2,cy=H/2;
 const maxK=Math.max(.6,...res.map(x=>x.k))*1.08,sc=R/maxK,cos=Math.cos(here.lat*Math.PI/180);
 const ink='currentColor';let g='';
 const rings=[.25,.5,.75,1].map(f=>f*maxK);
 rings.forEach((r,i)=>{g+=`<circle cx="${cx}" cy="${cy}" r="${r*sc}" fill="none" stroke="${ink}" stroke-opacity="${i===3?.35:.18}" stroke-dasharray="${i===3?'':'3 5'}"/>`});
 const lab=r=>{const m=travel(r).min;return(r<1?Math.round(r*1000)+' m':r.toFixed(1)+' km')+(W>420?' · '+fmtMin(m):'')};
 [1,3].forEach(i=>{const r=rings[i]*sc;g+=`<text x="${cx+4}" y="${cy-r-5}" font-size="12" fill="${ink}" fill-opacity=".6">${lab(rings[i])}</text>`});
 g+=`<line x1="${cx}" y1="${cy-R-8}" x2="${cx}" y2="${cy-R+6}" stroke="${ink}" stroke-opacity=".5"/><text x="${cx}" y="${cy-R-12}" text-anchor="middle" font-size="11" font-weight="700" fill="${ink}" fill-opacity=".6">N</text>`;
 (S.res||[]).forEach((x,i)=>{if(x.k==null)return;const dx=(x.p.lng-here.lng)*cos*111.32,dy=(x.p.lat-here.lat)*110.57;const px=cx+dx*sc,py=cy-dy*sc,col=CATS[x.p.cat].c;
  g+=`<line x1="${cx}" y1="${cy}" x2="${px}" y2="${py}" stroke="${col}" stroke-opacity=".35"/><circle cx="${px}" cy="${py}" r="13" fill="${col}"/><circle cx="${px-3}" cy="${py-3}" r="4" fill="#fff" fill-opacity=".25"/><text x="${px}" y="${py+4.5}" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">${i+1}</text>`});
 g+=`<circle class="pulse" cx="${cx}" cy="${cy}" r="9" fill="var(--red)"/><circle cx="${cx}" cy="${cy}" r="9" fill="var(--red)" stroke="var(--pass)" stroke-width="3"/><text x="${cx}" y="${cy+26}" text-anchor="middle" font-size="12" font-weight="700" fill="${ink}">toi</text>`;
 s.setAttribute('viewBox',`0 0 ${W} ${H}`);s.innerHTML=g}

const stars=n=>n?'<span class="stars" aria-label="'+n+' sur 5">'+'★'.repeat(n)+'<span style="opacity:.25">'+'★'.repeat(5-n)+'</span></span>':'';
function renderMemo(t){const subs=[['journal','Carnet'],['notes','Noter'],['recap','Récap']];if(!['journal','notes','recap'].includes(S.sub))S.sub=phase(t)==='apres'?'recap':'journal';
 let h=`<div class="subs">${subs.map(([k,n])=>`<button class="chip" aria-pressed="${S.sub===k}" data-a="sub" data-v="${k}">${n}</button>`).join('')}</div>`;
 const mp=S.sub==='journal'?mapPoints(t):null;if(mp)S.mapData=mp;
 const live=t.live&&t.shareCode?`<span class="pill co"><span style="width:7px;height:7px;border-radius:50%;background:#fff"></span>En direct</span>`:`<button class="pill" data-a="share">${ic('share','#0f3d3e',15,2.4)} Partager</button>`;
 const top=mp&&mp.pts.length?`<section class="hero map" id="map"><div class="lf" role="img" aria-label="Carte du voyage"></div><div class="bar" style="z-index:600">${tripPill(t,true)}${live}</div></section><div class="sheet">`:`${headHTML(t,'Carnet de route','',`<div style="margin-top:10px">${live}</div>`)}<div>`;
 if(S.sub==='recap')return top+h+`<div class="recap">${recapHTML(recapData(t),true)}</div></div>`;
 if(S.sub==='journal')return top+h+journalHTML(t,true)+'</div>';
 h=top+h;
 const ps=(t.places||[]),done=ps.filter(p=>p.visited),todo=ps.filter(p=>!p.visited&&(p.date&&p.date<=todayISO()));
 const rest=ps.filter(p=>!p.visited&&!todo.includes(p));
 const row=p=>placeRow(p,`<button class="btn s ${p.visited?'p':'g'}" data-a="memo" data-v="${p.id}">${p.visited?'Modifier':'Noter'}</button>`)+(p.visited&&(p.rating||p.comment||p.fav||(p.photos||[]).length)?`<div style="padding:0 0 10px 24px">${p.fav?'<span class="tag must">Coup de cœur</span> ':''}${stars(p.rating)}${p.comment?`<div class="note" style="color:var(--ink)">« ${esc(p.comment)} »</div>`:''}${photoHTML(p.photos)}</div>`:'');
 return h+`<div class="row" style="justify-content:space-between;margin-top:8px"><h2 style="margin:0">Où es-tu allé&#8239;?</h2><button class="btn r s" data-a="addDiscovery">+ Découverte sur place</button></div>
 <p class="hint">Note, commente et ajoute des photos. Ton récap se construit tout seul à partir d’ici.</p>
 ${done.length?'<h3 style="margin-top:16px">Faits ('+done.length+')</h3><div class="card" style="padding-top:2px">'+done.map(row).join('')+'</div>':''}
 ${todo.length?'<h3 style="margin-top:16px">Prévus, à confirmer</h3><div class="card" style="padding-top:2px">'+todo.map(row).join('')+'</div>':''}
 ${rest.length?'<h3 style="margin-top:16px">Pas encore faits</h3><div class="card" style="padding-top:2px">'+rest.map(row).join('')+'</div>':''}
 ${ps.length?'':'<div class="empty">Ajoute des adresses pour pouvoir les noter.</div>'}</div>`}
function photoHTML(ph){return(ph||[]).length?'<div class="photos">'+ph.map(f=>`<img src="${esc(fileUrl(f))}" alt="" loading="lazy">`).join('')+'</div>':''}
function recapData(t){const vis=(t.places||[]).filter(p=>p.visited);
 return{name:t.name,dest:t.dest,start:t.start,end:t.end,dayCity:Object.assign({},...days(t).map(d=>({[d]:cityOf(t,d)}))),
  places:vis.map(p=>({name:p.name,cat:p.cat,city:p.city||'',area:p.area||'',lat:p.lat??null,lng:p.lng??null,link:p.link||'',dur:p.dur||'',on:p.visitedOn||p.date||'',time:p.time||'',rating:p.rating||0,fav:!!p.fav,comment:p.comment||'',photos:(p.photos||[]).map(f=>({url:fileUrl(f)}))})),
  steps:stepsSorted(t).map(s=>({id:s.id,name:s.name||'',lat:s.lat??null,lng:s.lng??null,date:s.date||'',time:s.time||'',text:s.text||'',photos:(s.photos||[]).map(f=>({url:fileUrl(f)}))})),live:!!t.live}}
function recapHTML(r,own,heroMap){const ds=[];if(r.start&&r.end){let d=r.start;while(d<=r.end&&ds.length<120){ds.push(d);d=addDays(d,1)}}
 const P=r.places||[],favs=P.filter(p=>p.fav||p.rating>=4).sort((a,b)=>(b.fav-a.fav)||(b.rating-a.rating));
 const cities=[...new Set(P.map(p=>p.city).filter(Boolean))],photos=P.flatMap(p=>p.photos||[]);
 const ST=r.steps||[],SL=ST.filter(hasG);let mp=SL.length?{pts:SL.map((s,i)=>({lat:s.lat,lng:s.lng,photo:(s.photos||[])[0]||null,label:s.name,sid:s.id||'r'+ST.indexOf(s)})),planned:false}:{pts:P.filter(hasG).sort((a,b)=>((a.on||'')+(a.time||''))<((b.on||'')+(b.time||''))?-1:1).map(p=>({lat:p.lat,lng:p.lng,photo:(p.photos||[])[0]||null,label:p.name})),planned:false};S.mapData=mp;
 if(!P.length&&!ST.length)return`<div class="empty" style="margin-top:12px">${own?'Ton récap se remplira quand tu marqueras des adresses comme faites (onglet « Noter mes adresses » ou « Déjà fait » sur place). Il reprendra ton itinéraire réel jour par jour, tes notes, coups de cœur et photos.':'Ce récap est vide.'}</div>`;
 const byDay=ds.map((d,i)=>({d,i,c:(r.dayCity||{})[d]||'',ps:P.filter(p=>p.on===d).sort((a,b)=>(a.time||'99')<(b.time||'99')?-1:1)})).filter(x=>x.ps.length||x.c);
 const nod=P.filter(p=>!p.on||!ds.includes(p.on));
 const pl=p=>`<div class="pl"><span class="dot" style="color:${(CATS[p.cat]||CATS.autre).c}"></span><div><b>${esc(p.name)}</b> ${p.fav?'<span class="tag must">Coup de cœur</span>':''}<div class="note">${(CATS[p.cat]||CATS.autre).l}${p.area?' · '+esc(p.area):''} ${stars(p.rating)}</div>${p.comment?`<div class="note" style="color:var(--ink)">« ${esc(p.comment)} »</div>`:''}${photoHTML(p.photos)}</div><a class="btn s g" href="${mapsUrl(p)}" target="_blank" rel="noopener">Maps</a></div>`;
 return`<h2 style="font-size:28px;margin-top:18px">${esc(r.name)}</h2><p class="mute" style="margin:0">${esc(r.dest||'')} · ${fmtD(r.start,{weekday:undefined,month:'long'})} → ${fmtD(r.end,{weekday:undefined,month:'long',year:'numeric'})}${r.by?' · par '+esc(r.by):''}</p>
 ${heroMap&&mp.pts.length?'':mapBox(mp)}<div class="big3"><div><b>${ds.length}</b><span>jours</span></div><div><b>${Math.round(pathKm(mp.pts)).toLocaleString('fr-FR')}</b><span>km</span></div><div><b id="ncountries">${cities.length||'—'}</b><span id="nclab">${SL.length||P.some(hasG)?'pays':'villes'}</span></div><div><b>${P.length}</b><span>adresses faites</span></div></div><p class="hint" id="cnames"></p>
 ${own?`<div class="row"><button class="btn r" data-a="share">${T().shareCode?'Mettre à jour le partage':'Partager à mes amis'}</button><button class="btn" data-a="copyText">Copier en texte</button></div>${T().shareCode?`<p class="hint">Code à donner à tes amis : <b style="font-size:16px;color:var(--ink)">${esc(T().shareCode)}</b> (accueil → « Récupérer le voyage d’un ami »).</p>`:''}`:''}
 ${ST.length?'<h2>Le carnet de route</h2>'+stepsHTML(ST,false):''}
 ${favs.length?'<h2>Les meilleures adresses</h2><div class="card" style="padding-top:2px">'+favs.map(pl).join('')+'</div>':''}
 <h2>L’itinéraire réel</h2>${byDay.map(x=>`<div class="day"><b>${cap(fmtD(x.d))}</b> <small>Jour ${x.i+1}${x.c?' · '+esc(x.c):''}</small>${x.ps.length?x.ps.map(pl).join(''):'<div class="note">—</div>'}</div>`).join('')}
 ${nod.length?'<div class="day"><b>Sans date</b>'+nod.map(pl).join('')+'</div>':''}
 ${photos.length?'<h2>Photos</h2>'+photoHTML(photos):''}`}
function renderShared(){const r=S.recap;if(r==='load')return'<p class="load">Ouverture du voyage…</p>';if(r==='offline')return`<div class="empty" style="margin-top:20px">Pas de connexion pour charger ce voyage. Réessaie dans un instant.</div><p><button class="btn" data-a="home">Retour</button></p>`;if(!r)return`<div class="empty" style="margin-top:20px">Voyage introuvable : le lien est peut-être incomplet, ou le partage a été arrêté.</div><p><button class="btn" data-a="home">Retour</button></p>`;

 <section class="now" style="margin-top:28px;background:var(--sun);color:var(--teal)"><h2>Tu pars là-bas&#8239;?</h2><p style="margin:4px 0 12px">Récupère ce voyage : les adresses arrivent dans ta wishlist avec les notes de ${esc(r.by||'ton ami')}, et le programme se cale sur tes dates. Tu adaptes ensuite.</p><button class="btn r" data-a="importRecap">Récupérer et adapter</button></section></div>`}

async function aiCall(b){const r=await api('/api/ai',Object.assign({id:ME.id},b));return r.json}
async function enrich(){const F=$('#mf').elements,f={};['name','cat','city','area','geo','dur','note'].forEach(k=>f[k]=F.namedItem(k));const name=f.name.value.trim();if(!name){toast('Écris d’abord le nom.');return}const t=T(),h=$('#enh');h.textContent='Recherche en cours…';
 try{const r=await aiCall({kind:'enrich',name,city:f.city.value,dest:t.dest||t.name});
  if(!r||r.found===false){h.textContent='Lieu non reconnu avec certitude : complète à la main.';return}
  if(r.cat&&CATS[r.cat])f.cat.value=r.cat;if(r.city&&!f.city.value)f.city.value=r.city;if(r.area&&!f.area.value)f.area.value=r.area;
  if(typeof r.lat==='number'&&typeof r.lng==='number'&&!f.geo.value)f.geo.value=r.lat.toFixed(5)+', '+r.lng.toFixed(5);if(r.dur&&!f.dur.value)f.dur.value=r.dur;if(r.note&&!f.note.value)f.note.value=r.note;
  h.textContent='Complété : vérifie la position sur Maps si besoin.'}
 catch(e){h.textContent='Impossible pour le moment, réessaie plus tard.'}}

 try{const r=await aiCall({kind:'nearby',lat:here.lat,lng:here.lng,city:cityOf(t,d)||t.dest,mins:S.now.mins,want:S.now.want,time:nowHM()+' le '+fmtD(todayISO(),{month:'long'}),exclude:(t.places||[]).map(p=>p.name),prefs:lsGet('escale.prefs','')});

 const miss=ds.slice(0,-1).filter(d=>!nightOk(d)&&!(d===ds[0]&&bk.some(b=>TRANSP.includes(b.type)&&b.date===d)));
 // nuits consécutives regroupées

 const st=bk.filter(b=>b.type==='hotel'&&b.date&&b.city).sort((a,b)=>a.date<b.date?-1:1);
 for(let i=1;i<st.length;i++){const a=st[i-1],b=st[i];if(a.city.trim().toLowerCase()===b.city.trim().toLowerCase())continue;const from=a.endDate||b.date,to=b.date;
